document.addEventListener('click', function(e){
  // --- layar kunci ---
  const k = e.target.closest('[data-k]');
  if (k){
    const key = k.dataset.k;
    if (key === 'switch'){ signOutAndReset(); return; }
    if (key === 'resume'){ unlockApp(); return; }
    if (key === 'clear'){ lockState.pin = ''; lockState.error = ''; renderLock(); return; }
    if (key === 'back'){ lockState.pin = lockState.pin.slice(0,-1); renderLock(); return; }
    if (/^[0-9]$/.test(key) && lockState.pin.length < 6){
      lockState.pin += key; lockState.error = '';
      renderLock();
      if (lockState.pin.length === 6) tryPin();
    }
    return;
  }
  if (e.target.closest('[data-signout]')){ signOutAndReset(); return; }

  // --- kerangka aplikasi ---
  const nav = e.target.closest('[data-nav]');
  if (nav){ go(nav.dataset.nav); return; }
  if (e.target.closest('[data-lock]')){ lockApp(); return; }

  // --- kasir ---
  const add = e.target.closest('[data-add]');
  if (add){ addToCart(add.dataset.add); return; }
  const cat = e.target.closest('[data-cat]');
  if (cat){ App.posFilter.categoryId = cat.dataset.cat; renderPosCats(); renderPosGrid(); return; }
  const ci = e.target.closest('.ci');
  if (ci){
    const id = ci.dataset.line;
    const line = App.cart.find(function(c){ return c.lineId === id; });
    if (e.target.closest('[data-inc]')) return setQty(id, line.qty + 1);
    if (e.target.closest('[data-dec]')) return setQty(id, line.qty - 1);
    if (e.target.closest('[data-rm]'))  return setQty(id, 0);
    if (e.target.closest('[data-edit]'))return editCartLine(id);
  }
  if (e.target.closest('[data-pay]')) return openPayment();
  if (e.target.closest('[data-park]')) return parkCart();
  if (e.target.closest('[data-parked]')) return openParked();
  if (e.target.closest('[data-detail]')) return editCartMeta();
  if (e.target.closest('[data-orderdisc]')) return editOrderDiscount();
  if (e.target.closest('[data-openshift]')) return openShiftDialog();
  if (e.target.closest('[data-clearcart]')){
    if (!App.cart.length) return;
    confirmDialog('Kosongkan keranjang', 'Semua item di keranjang akan dibuang.', 'Kosongkan', true).then(function(ok){
      if (!ok) return;
      App.cart = [];
      App.cartMeta = { orderType:'', customerName:'', customerPhone:'', note:'', discountBp:0, discountAmount:0 };
      renderCart(); renderPosGrid();
    });
    return;
  }
});

document.addEventListener('keydown', function(e){
  if (!App.user) return;
  if (e.key === 'Escape' && _modalResolve){ closeModal(null); return; }
  if (e.target.matches('input,textarea,select') && e.key !== 'F2' && e.key !== 'F4' && e.key !== 'F8') return;
  if (e.key === 'F2'){ e.preventDefault(); go('pos'); setTimeout(function(){ const q = $('#pos-q'); if (q){ q.focus(); q.select(); } }, 40); }
  if (e.key === 'F4'){ e.preventDefault(); if (App.view === 'pos' && App.cart.length) openPayment(); }
  if (e.key === 'F8'){ e.preventDefault(); if (App.view === 'pos' && App.cart.length) parkCart(); }
});

window.addEventListener('beforeunload', function(e){
  if (App.user && App.cart.length){ e.preventDefault(); e.returnValue = ''; }
});

/* ---- Penyalaan: ambil alamat server, buat klien, pulihkan sesi ---- */
async function loadCloudConfig(){
  try {
    const r = await fetch('/api/config', { cache:'no-store' });
    if (r.ok){
      const j = await r.json();
      if (j && j.url && j.anonKey) return j;
    }
  } catch (e){}
  try {
    const j = JSON.parse(localStorage.getItem('kasir.cloud') || 'null');
    if (j && j.url && j.anonKey) return j;
  } catch (e){}
  return null;
}

function renderCloudSetup(msg){
  const saved = (function(){ try { return JSON.parse(localStorage.getItem('kasir.cloud') || '{}'); } catch(e){ return {}; } })();
  $('#app').hidden = true;
  const wrap = $('#lock'); wrap.hidden = false;
  wrap.innerHTML = '<div class="lock"><div class="lock-card">' +
    '<h1>Sambungkan ke server</h1>' +
    '<p class="small muted" style="margin:6px 0 18px">Isi alamat proyek Supabase Anda. Keduanya ada di Supabase → Project Settings → API. Kunci <span class="strong">anon</span> memang boleh dipasang di aplikasi; yang tidak boleh adalah kunci service role.</p>' +
    '<div class="field"><label for="cu">Project URL</label>' +
    '<input class="input" id="cu" placeholder="https://xxxx.supabase.co" value="' + esc(saved.url || '') + '"></div>' +
    '<div class="field" style="margin-top:12px"><label for="ck">Anon public key</label>' +
    '<input class="input" id="ck" placeholder="eyJhbGciOi..." value="' + esc(saved.anonKey || '') + '"></div>' +
    '<div class="err" id="ce" ' + (msg ? '' : 'hidden') + ' style="margin-top:10px">' + esc(msg || '') + '</div>' +
    '<button class="btn btn-primary btn-lg btn-block" id="cgo" style="margin-top:18px">Simpan dan lanjut</button>' +
    '<p class="tiny muted" style="margin-top:14px">Kalau aplikasi ini dijalankan di Vercel dengan variabel lingkungan SUPABASE_URL dan SUPABASE_ANON_KEY, layar ini tidak akan muncul lagi.</p>' +
    '</div></div>';
  $('#cgo').addEventListener('click', function(){
    const url = $('#cu').value.trim().replace(/\/+$/, '');
    const key = $('#ck').value.trim();
    if (!/^https:\/\/.+/.test(url) || key.length < 20){
      const e = $('#ce'); e.hidden = false; e.textContent = 'Alamat atau kunci belum benar.'; return;
    }
    localStorage.setItem('kasir.cloud', JSON.stringify({ url:url, anonKey:key }));
    location.reload();
  });
}

function fatal(title, detail){
  document.body.innerHTML =
    '<div class="lock"><div class="lock-card"><h1>' + esc(title) + '</h1>' +
    '<p class="small">' + esc(detail) + '</p></div></div>';
}

/* Layar apa pun lebih baik daripada layar putih: kalau penyalaan gagal,
   sebabnya ditulis di layar, bukan hanya di konsol. */
window.addEventListener('error', function(ev){
  if (document.getElementById('lock') && !document.getElementById('lock').innerHTML && (!App || !App.user)){
    fatal('Aplikasi gagal dijalankan', (ev.message || 'galat tidak dikenal') +
          ' — ' + (ev.filename || '') + ':' + (ev.lineno || 0));
  }
});

(async function boot(){
 try {
  splash('Menyiapkan…', 'Menghubungi server.');
  if (!window.supabase || !window.supabase.createClient){
    fatal('Pustaka Supabase gagal dimuat',
          'Periksa sambungan internet lalu muat ulang halaman. Aplikasi ini memerlukan internet karena datanya ada di server.');
    return;
  }
  const cfg = await loadCloudConfig();
  if (!cfg){ renderCloudSetup(); return; }

  CLOUD.url = cfg.url; CLOUD.key = cfg.anonKey;
  try {
    CLOUD.sb = window.supabase.createClient(cfg.url, cfg.anonKey, {
      auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true },
      realtime: { params: { eventsPerSecond: 5 } }
    });
  } catch (ex){
    renderCloudSetup('Alamat server ditolak: ' + (ex.message || ex));
    return;
  }

  CLOUD.sb.auth.onAuthStateChange(function(event){
    if (event === 'SIGNED_OUT' && App.user){
      App.user = null;
      authMode = 'login';
      renderAuth('Sesi berakhir. Masuk kembali untuk melanjutkan.');
    }
  });

  let session = null;
  try {
    const s = await CLOUD.sb.auth.getSession();
    session = s && s.data ? s.data.session : null;
  } catch (ex){}

  if (session) await enterApp();
  else renderAuth();

  // Sambungkan ulang printer yang sudah pernah diizinkan (kalau peramban mengizinkan).
  setTimeout(function(){ if (PRN.cfg.deviceName) prnReconnect().catch(function(){}); }, 1200);
 } catch (ex){
  fatal('Aplikasi gagal dijalankan', (ex && (ex.message || ex.toString())) || 'galat tidak dikenal');
 }
})();
</script>
