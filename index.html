<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir — Point of Sale Online</title>
  <style>
    /* Reset dasar */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; color: #1f2937; }

    /* PERBAIKAN KRITIS: Hanya terapkan flex jika TIDAK ada atribut 'hidden' */
    #app:not([hidden]) {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Loading screen (muncul saat app masih hidden) */
    #loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Login Container */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 400px;
    }

    .login-box h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; text-align: center; }
    .login-box p { color: #6b7280; margin-bottom: 24px; text-align: center; font-size: 0.875rem; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus { outline: none; border-color: #3b82f6; ring: 2px solid #93c5fd; }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-primary:active { transform: scale(0.98); }

    .error-msg {
      background-color: #fef2f2;
      color: #dc2626;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Loading Screen (Akan disembunyikan oleh JS saat siap) -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p>Memuat aplikasi kasir…<br><small>Kalau tulisan ini tidak hilang dalam beberapa detik, berkas yang tersimpan di server bukan yang terbaru.</small></p>
  </div>

  <!-- Main App (Awalnya hidden, akan ditampilkan JS) -->
  <div id="app" hidden>
    <div class="login-container">
      <div class="login-box">
        <h1>Cute Dimsum — POS</h1>
        <p>Silakan masuk untuk memulai shift kasir</p>
        
        <div id="error-box" class="error-msg"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email">Email / ID Kasir</label>
            <input type="text" id="email" placeholder="kasir@demo.local" required value="kasir@demo.local">
          </div>
          <div class="form-group">
            <label for="password">Password / PIN</label>
            <input type="password" id="password" placeholder="••••••••" required value="password123">
          </div>
          <button type="submit" class="btn-primary">Masuk ke Sistem</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Simulasi proses inisialisasi aplikasi
    document.addEventListener('DOMContentLoaded', () => {
      const loadingScreen = document.getElementById('loading-screen');
      const app = document.getElementById('app');
      const loginForm = document.getElementById('login-form');
      const errorBox = document.getElementById('error-box');

      // Simulasi delay loading 1 detik (seperti mengambil config dari server)
      setTimeout(() => {
        // PERBAIKAN BERFUNGSI DI SINI: 
        // Kita menghapus atribut 'hidden', sehingga CSS #app:not([hidden]) aktif 
        // dan loading screen bisa kita sembunyikan.
        app.removeAttribute('hidden');
        loadingScreen.style.display = 'none';
      }, 800);

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Validasi dummy
        if (email === 'kasir@demo.local' && password === 'password123') {
          errorBox.style.display = 'none';
          alert('Login berhasil! Mengalihkan ke dashboard kasir...');
          // window.location.href = '/dashboard';
        } else {
          errorBox.textContent = 'Email atau password salah. Silakan coba lagi.';
          errorBox.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
