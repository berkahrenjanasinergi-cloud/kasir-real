/* ---- Dialog pembayaran ---- */
async function openPayment(){
  if (!App.cart.length) return;
  if (!App.shift){
    const ok = await confirmDialog('Shift belum dibuka',
      'Penjualan tetap bisa dicatat, tapi tidak akan masuk hitungan kas saat tutup shift. Buka shift dulu?', 'Buka shift');
    if (ok){ await openShiftDialog(); if (!App.shift) return; }
  }
  const t = cartTotals();
  const methods = App.settings.paymentMethods;
  let rows = [{ method:'Tunai', amount:0, ref:'' }];

  const quick = [t.grandTotal, 20000, 50000, 100000, 150000, 200000];
  const body =
    '<div class="row" style="justify-content:space-between;font-size:20px;font-weight:680;margin-bottom:14px">' +
      '<span>Total tagihan</span><span class="money">' + Money.rp(t.grandTotal) + '</span></div>' +
    '<div id="pay-rows"></div>' +
    '<button class="btn btn-sm" id="pay-add" style="margin-top:10px">+ Tambah metode (bayar terpisah)</button>' +
    '<div class="row wrap" style="margin-top:14px" id="pay-quick">' +
      quick.map(function(v,i){ return '<button class="btn btn-sm" data-quick="' + v + '">' + (i===0 ? 'Uang pas' : Money.plain(v)) + '</button>'; }).join('') +
    '</div>' +
    '<div class="totals" style="margin-top:16px;border-radius:10px">' +
      '<div class="tl"><span>Dibayar</span><span class="money" id="pay-paid">0</span></div>' +
      '<div class="tl grand"><span id="pay-diff-label">Kurang</span><span class="money" id="pay-diff">0</span></div>' +
    '</div>' +
    '<div class="err" id="pay-err" hidden style="margin-top:10px"></div>';

  await modal({
    title: 'Pembayaran', body: body,
    footer: '<button class="btn" data-close>Batal</button>' +
            '<button class="btn btn-primary btn-lg" id="pay-go">Selesaikan</button>',
    onMount: function(root){
      const draw = function(){
        root.querySelector('#pay-rows').innerHTML = rows.map(function(r,i){
          return '<div class="row" style="margin-bottom:8px" data-r="' + i + '">' +
            '<select class="input" data-m style="flex:1 1 130px">' +
              methods.map(function(m){ return '<option ' + (m===r.method?'selected':'') + '>' + esc(m) + '</option>'; }).join('') +
            '</select>' +
            '<input class="input money" data-a inputmode="numeric" style="flex:1 1 110px" value="' + (r.amount ? Money.plain(r.amount) : '') + '" placeholder="0">' +
            (rows.length > 1 ? '<button class="btn btn-ghost btn-sm" data-x>✕</button>' : '') +
          '</div>';
        }).join('');
        recalc();
      };
      const recalc = function(){
        const paid = rows.reduce(function(a,r){ return a + r.amount; }, 0);
        const diff = paid - t.grandTotal;
        root.querySelector('#pay-paid').textContent = Money.plain(paid);
        root.querySelector('#pay-diff-label').textContent = diff >= 0 ? 'Kembalian' : 'Kurang';
        root.querySelector('#pay-diff').textContent = Money.plain(Math.abs(diff));
      };
      root.addEventListener('input', function(e){
        const wrap = e.target.closest('[data-r]'); if (!wrap) return;
        const i = +wrap.dataset.r;
        if (e.target.hasAttribute('data-a')){
          rows[i].amount = Money.parse(e.target.value);
          e.target.value = rows[i].amount ? Money.plain(rows[i].amount) : '';
          recalc();
        }
      });
      root.addEventListener('change', function(e){
        const wrap = e.target.closest('[data-r]'); if (!wrap) return;
        if (e.target.hasAttribute('data-m')) rows[+wrap.dataset.r].method = e.target.value;
      });
      root.addEventListener('click', function(e){
        const x = e.target.closest('[data-x]');
        if (x){ rows.splice(+x.closest('[data-r]').dataset.r, 1); draw(); return; }
        const q = e.target.closest('[data-quick]');
        if (q){ rows[0].amount = Money.int(q.dataset.quick); draw(); return; }
        if (e.target.closest('#pay-add')){ rows.push({ method: methods[1] || 'Tunai', amount:0, ref:'' }); draw(); return; }
      });
      root.querySelector('#pay-go').addEventListener('click', async function(){
        const btn = this;
        const err = root.querySelector('#pay-err');
        err.hidden = true;
        btn.disabled = true; btn.textContent = 'Menyimpan…';
        try {
          const res = await createSale({
            clientUuid: uid(),
            items: App.cart.map(function(c){ return { productId:c.productId, name:c.name, price:c.price, qty:c.qty, discount:c.discount }; }),
            payments: rows,
            discountBp: App.cartMeta.discountBp,
            discountAmount: App.cartMeta.discountAmount,
            orderType: App.cartMeta.orderType,
            customerName: App.cartMeta.customerName,
            customerPhone: App.cartMeta.customerPhone,
            note: App.cartMeta.note
          });
          App.cart = [];
          App.cartMeta = { orderType:'', customerName:'', customerPhone:'', note:'', discountBp:0, discountAmount:0 };
          await refreshCaches();
          closeModal(true);
          renderView();
          toast('Nota ' + res.order.no + ' tersimpan. Kembalian ' + Money.rp(res.order.change) + '.');
          autoPrint(res.order);
          showReceipt(res.order);
        } catch (ex){
          err.hidden = false; err.textContent = ex.message || String(ex);
          btn.disabled = false; btn.textContent = 'Selesaikan';
        }
      });
      draw();
    }
  });
}

/* ===========================================================================
   PRINTER BLUETOOTH (ESC/POS)
   Pengaturan printer disimpan di perangkat ini, bukan di server: satu toko
   bisa punya beberapa kasir dengan printer berbeda-beda.

   Dukungan peramban: Chrome/Edge di Android, Windows, macOS, Linux, dan
   ChromeOS. Safari dan Chrome di iPhone/iPad TIDAK mendukung Web Bluetooth —
   di sana pakai tombol "Cetak" biasa (AirPrint) atau peramban Bluefy.
   Halaman harus dibuka lewat https (Vercel sudah https) atau localhost.
   =========================================================================== */
const PRN = {
  device: null, char: null, busy: false,
  cfg: (function(){
    const d = { deviceName:'', cols:32, copies:1, cut:true, feed:4, auto:true, drawer:false };
    try { return Object.assign(d, JSON.parse(localStorage.getItem('kasir.printer') || '{}')); }
    catch(e){ return d; }
  })(),
  save: function(){ localStorage.setItem('kasir.printer', JSON.stringify(PRN.cfg)); },
  supported: function(){ return !!(navigator.bluetooth && navigator.bluetooth.requestDevice); },
  connected: function(){ return !!(PRN.char && PRN.device && PRN.device.gatt && PRN.device.gatt.connected); }
};

/* Layanan BLE yang lazim dipakai printer struk 58/80 mm. */
const PRN_SERVICES = [
  '000018f0-0000-1000-8000-00805f9b34fb',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
  '0000ff00-0000-1000-8000-00805f9b34fb',
  '0000ffe0-0000-1000-8000-00805f9b34fb',
  '0000ff80-0000-1000-8000-00805f9b34fb'
];

async function prnPickCharacteristic(server){
  const services = await server.getPrimaryServices();
  for (const s of services){
    let chars = [];
    try { chars = await s.getCharacteristics(); } catch(e){ continue; }
    for (const c of chars){
      if (c.properties && (c.properties.write || c.properties.writeWithoutResponse)) return c;
    }
  }
  return null;
}

/** Pilih & sambungkan printer. Wajib dipicu oleh ketukan pengguna. */
async function prnPair(){
  if (!PRN.supported()) throw new Error('Peramban ini tidak mendukung Bluetooth. Pakai Chrome di Android, Windows, atau macOS.');
  const device = await navigator.bluetooth.requestDevice({
    acceptAllDevices: true,
    optionalServices: PRN_SERVICES
  });
  await prnAttach(device);
  PRN.cfg.deviceName = device.name || 'Printer';
  PRN.save();
  return device;
}

async function prnAttach(device){
  const server = await device.gatt.connect();
  const char = await prnPickCharacteristic(server);
  if (!char) throw new Error('Perangkat ini tidak punya jalur tulis. Pastikan yang dipilih adalah printer struk.');
  PRN.device = device;
  PRN.char = char;
  device.addEventListener('gattserverdisconnected', function(){
    PRN.char = null;
    paintPrinterStatus();
  });
  paintPrinterStatus();
  return char;
}

/** Sambungkan ulang tanpa dialog, kalau perangkat sudah pernah diizinkan. */
async function prnReconnect(){
  if (PRN.connected()) return true;
  if (PRN.device){ try { await prnAttach(PRN.device); return true; } catch(e){} }
  if (navigator.bluetooth && navigator.bluetooth.getDevices){
    try {
      const list = await navigator.bluetooth.getDevices();
      const found = list.find(function(d){ return d.name === PRN.cfg.deviceName; }) || list[0];
      if (found){ await prnAttach(found); return true; }
    } catch(e){}
  }
  return false;
}

async function prnDisconnect(){
  try { if (PRN.device && PRN.device.gatt.connected) PRN.device.gatt.disconnect(); } catch(e){}
  PRN.char = null;
  paintPrinterStatus();
}

async function prnWrite(bytes){
  if (!PRN.connected()){
    const ok = await prnReconnect();
    if (!ok) throw new Error('Printer belum tersambung. Buka Pengaturan → Printer, lalu tekan Hubungkan.');
  }
  const size = 180;                       // paket BLE kecil; printer murah mudah tersedak
  const slow = !PRN.char.properties.writeWithoutResponse;
  for (let i = 0; i < bytes.length; i += size){
    const chunk = bytes.slice(i, i + size);
    if (PRN.char.properties.writeWithoutResponse && PRN.char.writeValueWithoutResponse){
      await PRN.char.writeValueWithoutResponse(chunk);
    } else {
      await PRN.char.writeValue(chunk);
    }
    await new Promise(function(r){ setTimeout(r, slow ? 30 : 18); });
  }
}

/* ---- Penyusun perintah ESC/POS ---- */
function EscPos(cols){
  const buf = [];
  const push = function(){ Array.prototype.forEach.call(arguments, function(b){ buf.push(b); }); };
  const api = {
    cols: cols,
    raw: function(arr){ arr.forEach(function(b){ buf.push(b); }); return api; },
    text: function(s){
      const clean = String(s == null ? '' : s)
        .replace(/[×✕]/g, 'x').replace(/[−–—]/g, '-')
        .replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/…/g, '...')
        .replace(/[^\x20-\x7E\n]/g, function(ch){
          const map = { 'é':'e','è':'e','ö':'o','ü':'u','ñ':'n','°':' ' };
          return map[ch] || '?';
        });
      for (let i = 0; i < clean.length; i++) buf.push(clean.charCodeAt(i) & 0xFF);
      return api;
    },
    line: function(s){ return api.text(String(s == null ? '' : s) + '\n'); },
    init:   function(){ push(0x1B, 0x40); return api; },
    left:   function(){ push(0x1B, 0x61, 0x00); return api; },
    center: function(){ push(0x1B, 0x61, 0x01); return api; },
    right:  function(){ push(0x1B, 0x61, 0x02); return api; },
    bold:   function(on){ push(0x1B, 0x45, on ? 1 : 0); return api; },
    big:    function(on){ push(0x1D, 0x21, on ? 0x11 : 0x00); return api; },
    feed:   function(n){ push(0x1B, 0x64, Math.max(0, Math.min(255, n || 1))); return api; },
    cut:    function(){ push(0x1D, 0x56, 0x42, 0x00); return api; },
    drawer: function(){ push(0x1B, 0x70, 0x00, 0x19, 0xFA); return api; },
    rule:   function(ch){ return api.line(new Array(cols + 1).join(ch || '-')); },
    /* Kiri–kanan dalam satu baris, angka selalu rapat ke kanan. */
    pair: function(l, r){
      const left = String(l == null ? '' : l);
      const right = String(r == null ? '' : r);
      const room = Math.max(1, cols - right.length);
      const cut = left.length > room - 1 ? left.slice(0, room - 1) : left;
      const gap = Math.max(1, cols - cut.length - right.length);
      return api.line(cut + new Array(gap + 1).join(' ') + right);
    },
    wrap: function(s){
      const words = String(s || '').split(/\s+/);
      let row = '';
      words.forEach(function(w){
        if ((row + ' ' + w).trim().length > cols){ api.line(row); row = w; }
        else row = (row ? row + ' ' : '') + w;
      });
      if (row) api.line(row);
      return api;
    },
    bytes: function(){ return new Uint8Array(buf); }
  };
  return api.init();
}

/** Struk penjualan dalam bentuk perintah printer. */
function escposReceipt(order){
  const st = App.settings;
  const cols = PRN.cfg.cols === 48 ? 48 : 32;
  const p = EscPos(cols);

  p.center().big(true).line(st.storeName).big(false);
  if (st.address) p.wrap(st.address);
  if (st.phone) p.line(st.phone);
  p.left().rule('=');
  p.pair('Nota', order.no);
  p.pair('Waktu', fmtDateTime(order.at));
  p.pair('Kasir', order.cashierName || '-');
  if (order.orderType) p.pair('Jenis', order.orderType);
  if (order.customerName) p.pair('Pelanggan', order.customerName);
  p.rule('-');

  order.items.forEach(function(i){
    p.line(i.name);
    p.pair('  ' + qtyText(i.qty) + ' x ' + Money.plain(i.unitPrice), Money.plain(i.lineTotal));
    if (i.discount) p.pair('  diskon', '-' + Money.plain(i.discount));
  });

  p.rule('-');
  p.pair('Subtotal', Money.plain(order.subtotal));
  if (order.itemDiscount)  p.pair('Diskon item', '-' + Money.plain(order.itemDiscount));
  if (order.orderDiscount) p.pair('Diskon nota', '-' + Money.plain(order.orderDiscount));
  if (order.serviceCharge) p.pair(st.service.name, Money.plain(order.serviceCharge));
  if (order.tax) p.pair(order.taxName + (order.taxInclusive ? ' (termasuk)' : ''), Money.plain(order.tax));
  if (order.roundingAdj) p.pair('Pembulatan', (order.roundingAdj > 0 ? '+' : '') + Money.plain(order.roundingAdj));
  p.rule('=');
  p.bold(true).pair('TOTAL', Money.plain(order.grandTotal)).bold(false);
  (order.payments || []).forEach(function(x){ p.pair(x.method, Money.plain(x.amount)); });
  if (order.change) p.pair('Kembali', Money.plain(order.change));
  if (order.status === 'VOID'){ p.rule('-'); p.center().line('-- NOTA DIBATALKAN --').left(); }
  if ((order.refundedAmount || 0) > 0) p.pair('Sudah di-refund', Money.plain(order.refundedAmount));

  p.rule('-');
  p.center();
  if (st.receiptFooter) p.wrap(st.receiptFooter);
  p.line(order.no + ' - ' + DEVICE.name);
  p.feed(PRN.cfg.feed || 3);
  if (PRN.cfg.cut) p.cut();
  return p.bytes();
}

/** Cetak struk lewat Bluetooth. Melempar galat bila printer tidak siap. */
async function printBluetooth(order){
  if (PRN.busy) throw new Error('Printer sedang mencetak. Tunggu sebentar.');
  PRN.busy = true;
  try {
    const bytes = escposReceipt(order);
    const copies = Math.max(1, Math.min(3, PRN.cfg.copies || 1));
    for (let i = 0; i < copies; i++){
      if (PRN.cfg.drawer && i === 0) await prnWrite(EscPos(PRN.cfg.cols).drawer().bytes());
      await prnWrite(bytes);
    }
  } finally { PRN.busy = false; }
}

async function printerTest(){
  const p = EscPos(PRN.cfg.cols === 48 ? 48 : 32);
  p.center().big(true).line(App.settings.storeName).big(false);
  p.line('Uji cetak').left().rule('-');
  p.pair('Perangkat', DEVICE.name);
  p.pair('Waktu', fmtDateTime(new Date().toISOString()));
  p.pair('Lebar', PRN.cfg.cols + ' karakter');
  p.rule('-');
  p.pair('Contoh nilai', Money.plain(1234567));
  p.bold(true).pair('TOTAL', Money.plain(1234567)).bold(false);
  p.feed(PRN.cfg.feed || 3);
  if (PRN.cfg.cut) p.cut();
  await prnWrite(p.bytes());
}

function printerStatusText(){
  if (!PRN.supported()) return { text:'Tidak didukung peramban ini', bad:true };
  if (PRN.connected())  return { text:'Tersambung: ' + (PRN.cfg.deviceName || 'printer'), bad:false };
  if (PRN.cfg.deviceName) return { text:'Belum tersambung (' + PRN.cfg.deviceName + ')', bad:true };
  return { text:'Belum ada printer', bad:true };
}
function paintPrinterStatus(){
  const el = $('#prn-status');
  if (!el) return;
  const s = printerStatusText();
  el.className = 'pill ' + (s.bad ? 'bad' : 'ok');
  el.textContent = s.text;
}

/* ---- Struk ---- */
function receiptHTML(order){
  const st = App.settings;
  const w = st.receiptWidth === 80 ? '72mm' : '54mm';
  const sep = '<hr>';
  const line = function(l, r){
    return '<tr><td>' + esc(l) + '</td><td class="r">' + esc(r) + '</td></tr>';
  };
  const itemRows = order.items.map(function(i){
    const q = qtyText(i.qty) + ' × ' + Money.plain(i.unitPrice);
    return '<tr><td colspan="2">' + esc(i.name) + '</td></tr>' +
           '<tr><td>&nbsp;&nbsp;' + esc(q) + '</td><td class="r">' + Money.plain(i.lineTotal) + '</td></tr>' +
           (i.discount ? '<tr><td>&nbsp;&nbsp;diskon</td><td class="r">−' + Money.plain(i.discount) + '</td></tr>' : '');
  }).join('');

  return '<div class="rcpt" style="width:' + w + ';margin:0 auto">' +
    '<div class="c big">' + esc(st.storeName) + '</div>' +
    (st.address ? '<div class="c">' + esc(st.address) + '</div>' : '') +
    (st.phone ? '<div class="c">' + esc(st.phone) + '</div>' : '') +
    sep +
    '<table><tbody>' +
      line('Nota', order.no) +
      line('Waktu', fmtDateTime(order.at)) +
      line('Kasir', order.cashierName) +
      (order.orderType ? line('Jenis', order.orderType) : '') +
      (order.customerName ? line('Pelanggan', order.customerName) : '') +
    '</tbody></table>' + sep +
    '<table><tbody>' + itemRows + '</tbody></table>' + sep +
    '<table><tbody>' +
      line('Subtotal', Money.plain(order.subtotal)) +
      (order.itemDiscount ? line('Diskon item', '−' + Money.plain(order.itemDiscount)) : '') +
      (order.orderDiscount ? line('Diskon nota', '−' + Money.plain(order.orderDiscount)) : '') +
      (order.serviceCharge ? line(st.service.name, Money.plain(order.serviceCharge)) : '') +
      (order.tax ? line(order.taxName + (order.taxInclusive ? ' (termasuk)' : ''), Money.plain(order.tax)) : '') +
      (order.roundingAdj ? line('Pembulatan', (order.roundingAdj>0?'+':'') + Money.plain(order.roundingAdj)) : '') +
    '</tbody></table>' + sep +
    '<table><tbody>' +
      '<tr><td class="big">TOTAL</td><td class="r big">' + Money.plain(order.grandTotal) + '</td></tr>' +
      order.payments.map(function(p){ return line(p.method, Money.plain(p.amount)); }).join('') +
      (order.change ? line('Kembali', Money.plain(order.change)) : '') +
    '</tbody></table>' +
    (order.status === 'VOID' ? sep + '<div class="c big">— NOTA DIBATALKAN —</div>' : '') +
    ((order.refundedAmount || 0) > 0 ? sep + '<div class="c">Sudah di-refund: ' + Money.plain(order.refundedAmount) + '</div>' : '') +
    sep +
    (st.receiptFooter ? '<div class="c">' + esc(st.receiptFooter) + '</div>' : '') +
    '<div class="c">&nbsp;</div>' +
  '</div>';
}
function printPaper(order){
  $('#receipt-area').innerHTML = receiptHTML(order);
  setTimeout(function(){ window.print(); }, 60);
}
/** Tombol "Cetak": pakai printer Bluetooth bila sudah diatur, selain itu kertas. */
function printReceipt(order){
  if (PRN.cfg.deviceName || PRN.connected()){
    printBluetooth(order).then(
      function(){ toast('Struk dikirim ke printer.'); },
      function(err){ toast(err.message, true); printPaper(order); }
    );
    return;
  }
  printPaper(order);
}
/** Dipanggil setelah pembayaran; tidak pernah menghentikan alur kasir. */
function autoPrint(order){
  if (!PRN.cfg.auto) return;
  if (!(PRN.cfg.deviceName || PRN.connected())) return;
  printBluetooth(order).catch(function(err){ toast('Cetak otomatis gagal: ' + err.message, true); });
}
function showReceipt(order){
  const btText = PRN.cfg.deviceName ? 'Cetak (' + esc(PRN.cfg.deviceName) + ')' : 'Cetak Bluetooth';
  modal({
    title: 'Struk ' + order.no,
    body: '<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto">' + receiptHTML(order) + '</div>',
    footer: '<button class="btn" data-close>Tutup</button>' +
            '<button class="btn" data-copy>Salin teks</button>' +
            '<button class="btn" data-paper>Cetak kertas</button>' +
            (PRN.supported() ? '<button class="btn btn-primary" data-bt>' + btText + '</button>' : ''),
    onMount: function(root){
      root.querySelector('[data-paper]').addEventListener('click', function(){ printPaper(order); });
      const bt = root.querySelector('[data-bt]');
      if (bt) bt.addEventListener('click', async function(){
        this.disabled = true; this.textContent = 'Mencetak…';
        try {
          if (!PRN.cfg.deviceName && !PRN.connected()) await prnPair();
          await printBluetooth(order);
          toast('Struk dikirim ke printer.');
        } catch (ex){
          if (!ex || ex.name !== 'NotFoundError') toast(ex.message, true);
        }
        this.disabled = false; this.textContent = btText;
      });
      root.querySelector('[data-copy]').addEventListener('click', function(){
        const tmp = document.createElement('div');
        tmp.innerHTML = receiptHTML(order).replace(/<\/tr>/g,'\n').replace(/<\/div>/g,'\n');
        const txt = (tmp.textContent || '').replace(/\n{3,}/g,'\n\n').trim();
        if (!navigator.clipboard || !navigator.clipboard.writeText){
          toast('Browser ini tidak mengizinkan penyalinan otomatis.', true); return;
        }
        navigator.clipboard.writeText(txt).then(function(){ toast('Teks struk disalin.'); },

async function editCartLine(lineId){
  const c = App.cart.find(function(x){ return x.lineId === lineId; });
  if (!c) return;
  const allowPrice = can(App.user, 'priceOverride');
  const body =
    '<div class="field"><label for="ep">Harga satuan</label>' +
    '<input class="input money" id="ep" inputmode="numeric" value="' + Money.plain(c.price) + '" ' + (allowPrice ? '' : 'disabled') + '>' +
    (allowPrice ? '' : '<div class="hint">Hanya manajer yang boleh mengubah harga.</div>') + '</div>' +
    '<div class="field" style="margin-top:12px"><label for="ed">Diskon baris ini (rupiah)</label>' +
    '<input class="input money" id="ed" inputmode="numeric" value="' + Money.plain(c.discount) + '"></div>' +
    '<div class="hint" style="margin-top:8px">Diskon tidak boleh melebihi nilai baris.</div>';
  await modal({
    title: c.name, body: body,
    footer: '<button class="btn" data-close>Batal</button><button class="btn btn-primary" data-ok>Simpan</button>',
    onMount: function(root){
      root.querySelector('[data-ok]').addEventListener('click', function(){
        if (allowPrice){
          const np = Money.parse(root.querySelector('#ep').value);
          if (np !== c.price){ c.price = np; c.priceEdited = true; }
        }
        c.discount = Math.min(Math.max(0, Money.parse(root.querySelector('#ed').value)), Money.int(c.price * c.qty));
        closeModal(true); renderCart();
      });
    }
  });
}

async function parkCart(){

  const label = await promptDialog('Tahan nota', 'Beri nama agar mudah dikenali', { value: App.cartMeta.customerName || ('Meja ' + (App.parkedCount + 1)) });
  if (label === null) return;
  await dbPut('parked', {

    by: App.user.name, cart: App.cart, meta: App.cartMeta
  });
  App.cart = [];
  App.cartMeta = { orderType:'', customerName:'', customerPhone:'', note:'', discountBp:0, discountAmount:0 };

  renderView();
  toast('Nota ditahan.');

async function openParked(){
  const list = (await dbGetAll('parked')).sort(function(a,b){ return b.at.localeCompare(a.at); });
  const body = list.length
    ? '<div class="userlist">' + list.map(function(p){
        const total = p.cart.reduce(function(a,c){ return a + Money.int(c.price*c.qty) - c.discount; }, 0);
        return '<button data-open="' + esc(p.id) + '"><span class="avatar">🧾</span>' +
          '<span style="flex:1"><span class="strong">' + esc(p.label) + '</span><br>' +

    : '<div class="empty"><h3>Belum ada nota ditahan</h3><p class="small">Tekan “Tahan nota” di keranjang untuk menyimpan pesanan sementara.</p></div>';
  await modal({
    title: 'Nota ditahan', body: body,
    onMount: function(root){
      root.addEventListener('click', async function(e){
        const d = e.target.closest('[data-del]');
        if (d){ e.stopPropagation(); await dbDel('parked', d.dataset.del); await refreshCaches(); closeModal(null); openParked(); return; }
        const o = e.target.closest('[data-open]');

async function openRefund(orderId){
  const o = await dbGet('orders', orderId);
  if (!o) return;
  const rows = o.items.map(function(i, idx){
    const remaining = Math.round((i.qty - (i.refundedQty || 0)) * 1000) / 1000;
    return { idx: idx, item: i, remaining: remaining };
  }).filter(function(r){ return r.remaining > 0; });

  if (!rows.length){ toast('Semua item pada nota ini sudah di-refund.', true); return; }

  const body =
    '<p class="small muted" style="margin:0 0 12px">Isi jumlah yang dikembalikan. Sisa yang boleh di-refund sudah dikurangi refund sebelumnya.</p>' +
    '<div class="table-wrap" style="max-height:38vh"><table><thead><tr><th>Produk</th><th class="num">Sisa</th><th class="num">Refund</th></tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr><td>' + esc(r.item.name) + '<br><span class="tiny muted">' + Money.plain(r.item.unitPrice) + ' / ' + esc(r.item.unit || 'unit') + '</span></td>' +
        '<td class="num">' + qtyText(r.remaining) + '</td>' +
        '<td class="num"><input class="input" style="width:82px;text-align:right" inputmode="decimal" data-ri="' + r.idx + '" data-max="' + r.remaining + '" value="0"></td></tr>';
    }).join('') + '</tbody></table></div>' +
    '<div class="field" style="margin-top:14px"><label for="rr">Alasan refund</label><input class="input" id="rr" placeholder="Barang rusak / salah pesan"></div>' +
    '<div class="field" style="margin-top:12px"><label for="rc">Dikembalikan lewat</label>' +
    '<select class="input" id="rc"><option value="1">Tunai (mengurangi isi laci)</option><option value="0">Non-tunai</option></select></div>' +
    '<div class="totals" style="border-radius:10px;margin-top:14px"><div class="tl grand"><span>Nilai refund</span><span class="money" id="rtot">0</span></div></div>' +
    '<div class="err" id="rerr" hidden style="margin-top:10px"></div>';

  await modal({
    title: 'Refund nota ' + o.no, wide:true, body: body,
    footer: '<button class="btn" data-close>Batal</button><button class="btn btn-danger" data-ok>Proses refund</button>',
    onMount: function(root){
      const calc = function(){
        let total = 0;
        rows.forEach(function(r){
          const inp = root.querySelector('[data-ri="' + r.idx + '"]');
          let q = Number(inp.value) || 0;
          if (q < 0) q = 0;
          if (q > r.remaining){ q = r.remaining; inp.value = qtyText(q); }
          const linePaid = r.item.lineTotal - (r.item.orderDiscountShare || 0);
          const per = r.item.qty > 0 ? linePaid / r.item.qty : 0;
          total += Money.int(per * q);
        });
        root.querySelector('#rtot').textContent = Money.plain(total);
        return total;
      };
      root.addEventListener('input', function(e){ if (e.target.hasAttribute('data-ri')) calc(); });
      root.querySelector('[data-ok]').addEventListener('click', async function(){
        const err = root.querySelector('#rerr'); err.hidden = true;
        const reason = root.querySelector('#rr').value.trim();
        if (!reason){ err.hidden = false; err.textContent = 'Alasan refund wajib diisi.'; return; }
        const lines = rows.map(function(r){
          return { index: r.idx, qty: Number(root.querySelector('[data-ri="' + r.idx + '"]').value) || 0 };
        }).filter(function(l){ return l.qty > 0; });
        if (!lines.length){ err.hidden = false; err.textContent = 'Belum ada item yang dipilih.'; return; }
        const actor = await requireApproval('refund', 'manajer');
        if (!actor) return;
        try {
          const res = await refundOrder(o.id, lines, reason, root.querySelector('#rc').value === '1', actor);
          await refreshCaches();
          closeModal(true); renderView();
          toast('Refund ' + Money.rp(res.amount) + ' diproses.');
        } catch (ex){ err.hidden = false; err.textContent = ex.message; }
      });
    }
  });
}

async function editProduct(id){
  const p = id ? App.products.find(function(x){ return x.id === id; }) : null;
  const isNew = !p;
  const v = p || { name:'', sku:'', barcode:'', categoryId:(App.categories[0]||{}).id||'', unit:'pcs',
                   price:0, cost:0, stock:0, reorderPoint:5, trackStock:true, taxable:true, active:true };
  const body =
    '<div class="field"><label for="xn">Nama produk</label><input class="input" id="xn" value="' + esc(v.name) + '" autofocus></div>' +
    '<div class="row wrap" style="margin-top:12px">' +
      '<div class="field" style="flex:1 1 140px"><label for="xs">SKU</label><input class="input" id="xs" value="' + esc(v.sku) + '" placeholder="otomatis"></div>' +
      '<div class="field" style="flex:1 1 140px"><label for="xb">Barcode</label><input class="input" id="xb" value="' + esc(v.barcode) + '"></div>' +
    '</div>' +
    '<div class="row wrap" style="margin-top:12px">' +
      '<div class="field" style="flex:1 1 150px"><label for="xc">Kategori</label><select class="input" id="xc">' +
        App.categories.map(function(c){ return '<option value="' + esc(c.id) + '" ' + (v.categoryId===c.id?'selected':'') + '>' + esc(c.name) + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="field" style="flex:1 1 110px"><label for="xu">Satuan</label><input class="input" id="xu" value="' + esc(v.unit) + '"></div>' +
    '</div>' +
    '<div class="row wrap" style="margin-top:12px">' +
      '<div class="field" style="flex:1 1 140px"><label for="xp">Harga jual</label><input class="input money" id="xp" inputmode="numeric" value="' + Money.plain(v.price) + '"></div>' +
      '<div class="field" style="flex:1 1 140px"><label for="xk">Harga modal (HPP)</label><input class="input money" id="xk" inputmode="numeric" value="' + Money.plain(v.cost) + '"></div>' +
    '</div>' +
    '<div class="row wrap" style="margin-top:12px">' +
      '<div class="field" style="flex:1 1 130px"><label for="xt">Lacak stok</label><select class="input" id="xt">' +
        '<option value="1" ' + (v.trackStock?'selected':'') + '>Ya</option><option value="0" ' + (!v.trackStock?'selected':'') + '>Tidak (jasa)</option></select></div>' +
      '<div class="field" style="flex:1 1 110px"><label for="xr">Batas stok menipis</label><input class="input" id="xr" inputmode="decimal" value="' + qtyText(v.reorderPoint) + '"></div>' +
      '<div class="field" style="flex:1 1 110px"><label for="xa">Status</label><select class="input" id="xa">' +
        '<option value="1" ' + (v.active!==false?'selected':'') + '>Aktif</option><option value="0" ' + (v.active===false?'selected':'') + '>Nonaktif</option></select></div>' +
    '</div>' +
    (isNew ? '<div class="field" style="margin-top:12px"><label for="xq">Stok awal</label><input class="input" id="xq" inputmode="decimal" value="0"></div>'
           : '<div class="hint" style="margin-top:12px">Stok saat ini ' + qtyText(v.stock) + '. Ubah jumlah stok lewat menu Stok agar tercatat di kartu stok.</div>') +
    '<div class="err" id="xe" hidden style="margin-top:10px"></div>';

  await modal({
    title: isNew ? 'Produk baru' : 'Ubah produk', body: body,
    footer: (isNew ? '' : '<button class="btn btn-danger" data-del>Hapus</button>') +
            '<div class="spacer"></div><button class="btn" data-close>Batal</button><button class="btn btn-primary" data-ok>Simpan</button>',
    onMount: function(root){
      const del = root.querySelector('[data-del]');
      if (del) del.addEventListener('click', async function(){
        const used = (await dbGetAll('orders')).some(function(o){ return o.items.some(function(i){ return i.productId === p.id; }); });
        if (used){
          const ok = await confirmDialog('Produk sudah pernah terjual',
            'Menghapusnya akan membuat laporan lama kehilangan rujukan produk. Lebih aman menonaktifkannya. Tetap hapus?', 'Tetap hapus', true);
          if (!ok) return;
        }
        await dbDel('products', p.id);
        await refreshCaches(); closeModal(true); renderView(); toast('Produk dihapus.');
      });
      root.querySelector('[data-ok]').addEventListener('click', async function(){
        const err = root.querySelector('#xe');
        const name = root.querySelector('#xn').value.trim();
        if (!name){ err.hidden = false; err.textContent = 'Nama produk wajib diisi.'; return; }
        let sku = root.querySelector('#xs').value.trim();
        if (!sku) sku = 'SKU' + Date.now().toString(36).toUpperCase();
        const clash = App.products.find(function(x){ return x.sku === sku && (!p || x.id !== p.id); });
        if (clash){ err.hidden = false; err.textContent = 'SKU "' + sku + '" sudah dipakai produk "' + clash.name + '".'; return; }

        const rec = Object.assign({}, p || {}, {
          id: p ? p.id : uid(),
          name: name, sku: sku,
          barcode: root.querySelector('#xb').value.trim(),
          categoryId: root.querySelector('#xc').value,
          unit: root.querySelector('#xu').value.trim() || 'pcs',
          price: Money.parse(root.querySelector('#xp').value),
          cost: Money.parse(root.querySelector('#xk').value),
          trackStock: root.querySelector('#xt').value === '1',
          reorderPoint: Number(root.querySelector('#xr').value) || 0,
          active: root.querySelector('#xa').value === '1',
          taxable: true,
          isDemo: p ? !!p.isDemo : false,
          createdAt: p ? p.createdAt : new Date().toISOString()
        });
        if (isNew){
          const q = Number(root.querySelector('#xq').value) || 0;
          rec.stock = rec.trackStock ? q : 0;
          const t = tx(['products','stockMoves'],'readwrite');
          t.products.add(rec);
          if (rec.trackStock && q !== 0){
            const at = new Date().toISOString();
            t.stockMoves.add({ id:uid(), at:at, localDate:localDate(at), productId:rec.id, type:'OPENING',
              qtyDelta:q, unitCost:rec.cost, refType:'MANUAL', refId:null, refNo:'', userId:App.user.id, note:'Stok awal' });
          }
          await t.done;
        } else {
          await dbPut('products', rec);
        }
        await refreshCaches(); closeModal(true); renderView();
        toast(isNew ? 'Produk ditambahkan.' : 'Perubahan tersimpan.');
      });
    }
  });
}

async function manageCategories(){
  const draw = function(){
    return '<div class="userlist">' + App.categories.map(function(c){
      const n = App.products.filter(function(p){ return p.categoryId === c.id; }).length;
      return '<div class="row" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px">' +
        '<span style="flex:1"><span class="strong">' + esc(c.name) + '</span> <span class="tiny muted">' + n + ' produk</span></span>' +
        '<button class="btn btn-ghost btn-sm" data-ren="' + esc(c.id) + '">Ubah nama</button>' +
        '<button class="btn btn-ghost btn-sm" data-delc="' + esc(c.id) + '">✕</button></div>';
    }).join('') + '</div>' +
    '<div class="row" style="margin-top:12px"><input class="input" id="newcat" placeholder="Nama kategori baru" style="flex:1">' +
    '<button class="btn btn-primary" id="addcat">Tambah</button></div>';
  };
  await modal({
    title: 'Kategori', body: draw(),
    onMount: function(root){
      const rerender = function(){ root.querySelector('.modal-body').innerHTML = draw(); };
      root.addEventListener('click', async function(e){
        if (e.target.id === 'addcat'){
          const name = root.querySelector('#newcat').value.trim();
          if (!name) return;
          await dbPut('categories', { id:uid(), name:name, sort:(App.categories.length+1)*10 });
          await refreshCaches(); rerender(); renderView(); return;
        }
        const r = e.target.closest('[data-ren]');
        if (r){
          const c = App.categories.find(function(x){ return x.id === r.dataset.ren; });
          const nn = await promptDialog('Ubah nama kategori', 'Nama', { value:c.name });
          if (nn && nn.trim()){ c.name = nn.trim(); await dbPut('categories', c); await refreshCaches(); }
          closeModal(null); manageCategories(); renderView(); return;
        }
        const d = e.target.closest('[data-delc]');
        if (d){
          const used = App.products.filter(function(p){ return p.categoryId === d.dataset.delc; }).length;
          if (used){ toast('Kategori masih dipakai ' + used + ' produk.', true); return; }
          await dbDel('categories', d.dataset.delc);
          await refreshCaches(); rerender(); renderView();
        }
      });
    }
  });
}

function exportProducts(){
  const catName = function(id){ const c = App.categories.find(function(x){ return x.id===id; }); return c ? c.name : ''; };
  const rows = [['nama','sku','barcode','kategori','satuan','harga_jual','harga_modal','stok','batas_menipis','lacak_stok','aktif']];
  App.products.forEach(function(p){
    rows.push([p.name, p.sku, p.barcode, catName(p.categoryId), p.unit, p.price, p.cost,
               qtyText(p.stock), qtyText(p.reorderPoint), p.trackStock ? 'ya':'tidak', p.active===false ? 'tidak':'ya']);
  });
  downloadFile('produk-' + localDate() + '.csv', toCSV(rows), 'text/csv');
  toast('Daftar produk terunduh.');
}

async function importProducts(){
  const body =
    '<p class="small muted" style="margin:0 0 12px">Kolom yang dibaca: <span class="strong">nama, sku, barcode, kategori, satuan, harga_jual, harga_modal, stok, batas_menipis, lacak_stok, aktif</span>. ' +
    'Baris pertama harus berisi nama kolom. Ekspor CSV dulu untuk melihat contoh formatnya.</p>' +
    '<input type="file" id="impf" accept=".csv,text/csv" class="input">' +
    '<div id="imprev" style="margin-top:14px"></div>';
  await modal({
    title: 'Impor produk dari CSV', wide:true, body: body,
    footer: '<button class="btn" data-close>Batal</button><button class="btn btn-primary" data-ok disabled>Impor</button>',
    onMount: function(root){
      let parsed = null;
      root.querySelector('#impf').addEventListener('change', function(){
        const file = this.files[0]; if (!file) return;
        const fr = new FileReader();
        fr.onload = function(){
          const rows = parseCSV(String(fr.result));
          if (rows.length < 2){ root.querySelector('#imprev').innerHTML = '<div class="err">File kosong atau hanya berisi judul kolom.</div>'; return; }
          const head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
          const col = function(n){ return head.indexOf(n); };
          const ok = [], bad = [];
          rows.slice(1).forEach(function(r, i){
            const name = (r[col('nama')] || '').trim();
            if (!name){ bad.push({ line:i+2, why:'nama kosong' }); return; }
            const price = Money.parse(r[col('harga_jual')] || 0);
            if (price < 0){ bad.push({ line:i+2, why:'harga jual tidak valid' }); return; }
            ok.push({
              name: name,
              sku: (r[col('sku')] || '').trim(),
              barcode: (r[col('barcode')] || '').trim(),
              kategori: (r[col('kategori')] || '').trim(),
              unit: (r[col('satuan')] || 'pcs').trim() || 'pcs',
              price: price,
              cost: Money.parse(r[col('harga_modal')] || 0),
              stock: Number(String(r[col('stok')] || '0').replace(',','.')) || 0,
              reorder: Number(String(r[col('batas_menipis')] || '0').replace(',','.')) || 0,
              track: String(r[col('lacak_stok')] || 'ya').trim().toLowerCase() !== 'tidak',
              active: String(r[col('aktif')] || 'ya').trim().toLowerCase() !== 'tidak'
            });
          });
          parsed = ok;
          root.querySelector('#imprev').innerHTML =
            '<div class="row wrap" style="gap:18px"><span class="pill ok">' + ok.length + ' baris siap diimpor</span>' +
            (bad.length ? '<span class="pill bad">' + bad.length + ' baris dilewati</span>' : '') + '</div>' +
            (bad.length ? '<div class="small muted" style="margin-top:8px">' + bad.slice(0,10).map(function(b){ return 'Baris ' + b.line + ': ' + b.why; }).join('<br>') + '</div>' : '');
          root.querySelector('[data-ok]').disabled = ok.length === 0;
        };
        fr.readAsText(file);
      });
      root.querySelector('[data-ok]').addEventListener('click', async function(){
        this.disabled = true; this.textContent = 'Mengimpor…';
        // Semua baris ditulis dalam satu transaksi: kalau gagal, tidak ada yang separuh masuk.
        const t = tx(['products','categories','stockMoves'], 'readwrite');
        const catMap = {};
        App.categories.forEach(function(c){ catMap[c.name.toLowerCase()] = c.id; });
        const existingSku = {};
        App.products.forEach(function(p){ existingSku[p.sku] = p; });
        const at = new Date().toISOString();
        let created = 0, updated = 0;
        for (const r of parsed){
          let catId = catMap[r.kategori.toLowerCase()];
          if (!catId && r.kategori){
            catId = uid();
            catMap[r.kategori.toLowerCase()] = catId;
            t.categories.add({ id:catId, name:r.kategori, sort:900 });
          }
          const sku = r.sku || ('SKU' + Math.random().toString(36).slice(2,8).toUpperCase());
          const old = existingSku[sku];
          if (old){
            const rec = Object.assign({}, old, { name:r.name, barcode:r.barcode, categoryId:catId || old.categoryId,
              unit:r.unit, price:r.price, cost:r.cost, reorderPoint:r.reorder, trackStock:r.track, active:r.active });
            t.products.put(rec); updated++;
          } else {
            const rec = { id:uid(), sku:sku, name:r.name, barcode:r.barcode, categoryId:catId || (App.categories[0]||{}).id || '',
              unit:r.unit, price:r.price, cost:r.cost, stock:r.track ? r.stock : 0, reorderPoint:r.reorder,
              trackStock:r.track, taxable:true, active:r.active, isDemo:false, createdAt:at };
            t.products.add(rec);
            if (rec.trackStock && r.stock !== 0){
              t.stockMoves.add({ id:uid(), at:at, localDate:localDate(at), productId:rec.id, type:'OPENING',
                qtyDelta:r.stock, unitCost:rec.cost, refType:'IMPORT', refId:null, refNo:'', userId:App.user.id, note:'Impor CSV' });
            }
            created++;
          }
        }
        try {
          await t.done;
          await refreshCaches(); closeModal(true); renderView();
          toast(created + ' produk baru, ' + updated + ' diperbarui.');
        } catch (ex){
          toast('Impor gagal, tidak ada data yang tersimpan: ' + ex.message, true);
        }
      });
    }
  });
}

const MOVE_LABEL = {
  SALE:'Penjualan', PURCHASE:'Barang masuk', ADJUST:'Koreksi', WASTE:'Rusak/terbuang',
  OPENING:'Stok awal', VOID_RETURN:'Nota dibatalkan', REFUND_RETURN:'Refund', OPNAME:'Stok opname'
};
let stockTab = 'daftar';
let stockLogDate = localDate();

async function viewStock(root){
  const low = App.products.filter(function(p){ return p.trackStock && (Number(p.stock)||0) <= (Number(p.reorderPoint)||0); });
  setHeader('Stok', low.length ? low.length + ' produk perlu segera diisi ulang' : 'Semua stok di atas batas aman');

  root.innerHTML =
    '<div class="row" style="margin-bottom:14px">' +
      '<button class="btn btn-sm" data-tab="daftar" ' + (stockTab==='daftar'?'aria-pressed="true"':'') + '>Stok saat ini</button>' +
      '<button class="btn btn-sm" data-tab="kartu" ' + (stockTab==='kartu'?'aria-pressed="true"':'') + '>Kartu stok</button>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-sm btn-primary" data-adjust>Catat perubahan stok</button>' +
    '</div><div id="stock-body"></div>';

  if (stockTab === 'daftar') renderStockList();
  else await renderStockCard();

  root.addEventListener('click', function(e){
    const t = e.target.closest('[data-tab]');
    if (t){ stockTab = t.dataset.tab; renderView(); return; }
    if (e.target.closest('[data-adjust]')) return adjustDialog(null);
    const a = e.target.closest('[data-adj]');
    if (a) return adjustDialog(a.dataset.adj);
  });
}

function renderStockList(){
  const list = App.products.filter(function(p){ return p.trackStock; })
    .sort(function(a,b){
      const la = (Number(a.stock)||0) - (Number(a.reorderPoint)||0);
      const lb = (Number(b.stock)||0) - (Number(b.reorderPoint)||0);
      return la - lb;
    });
  const totalValue = list.reduce(function(s,p){ return s + Money.int((Number(p.stock)||0) * p.cost); }, 0);
  $('#stock-body').innerHTML =
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px">' +
      '<div class="card stat"><div class="k">Nilai stok (HPP)</div><div class="v money">' + Money.rp(totalValue) + '</div>' +
      '<div class="d">' + list.length + ' produk dilacak</div></div>' +
      '<div class="card stat"><div class="k">Perlu diisi ulang</div><div class="v">' +
      list.filter(function(p){ return (Number(p.stock)||0) <= (Number(p.reorderPoint)||0); }).length + '</div>' +
      '<div class="d">di bawah atau sama dengan batas</div></div>' +
    '</div>' +
    (list.length ? '<div class="card"><div class="table-wrap"><table><thead><tr>' +
      '<th>Produk</th><th class="num">Stok</th><th class="num">Batas</th><th class="num">HPP satuan</th><th class="num">Nilai</th><th></th></tr></thead><tbody>' +
      list.map(function(p){
        const s = Number(p.stock)||0, rp = Number(p.reorderPoint)||0;
        const badge = s <= 0 ? '<span class="pill bad">habis</span>' : (s <= rp ? '<span class="pill warn">menipis</span>' : '');
        return '<tr><td><span class="strong">' + esc(p.name) + '</span> ' + badge + '<br><span class="tiny muted">' + esc(p.sku) + '</span></td>' +
          '<td class="num strong">' + qtyText(s) + ' <span class="tiny muted">' + esc(p.unit||'') + '</span></td>' +
          '<td class="num small">' + qtyText(rp) + '</td>' +
          '<td class="num money">' + Money.plain(p.cost) + '</td>' +
          '<td class="num money">' + Money.plain(Money.int(s * p.cost)) + '</td>' +
          '<td><button class="btn btn-sm" data-adj="' + esc(p.id) + '">Ubah</button></td></tr>';
      }).join('') + '</tbody></table></div></div>'
    : '<div class="card"><div class="empty"><h3>Belum ada produk berstok</h3><p class="small">Aktifkan “Lacak stok” pada produk agar muncul di sini.</p></div></div>');
}

async function renderStockCard(){
  const moves = (await dbGetAll('stockMoves')).filter(function(m){ return m.localDate === stockLogDate; })
    .sort(function(a,b){ return b.at.localeCompare(a.at); });
  const pname = function(id){ const p = App.products.find(function(x){ return x.id===id; }); return p ? p.name : '(produk terhapus)'; };
  $('#stock-body').innerHTML =
    '<div class="card card-pad" style="margin-bottom:14px"><div class="row wrap">' +
      '<div class="field"><label for="sd">Tanggal</label><input class="input" type="date" id="sd" value="' + stockLogDate + '"></div>' +
      '<div class="spacer"></div><button class="btn btn-sm" data-expmoves>Unduh CSV</button>' +
    '</div></div>' +
    (moves.length ? '<div class="card"><div class="table-wrap"><table><thead><tr>' +
      '<th>Jam</th><th>Produk</th><th>Jenis</th><th class="num">Perubahan</th><th>Rujukan</th><th>Catatan</th></tr></thead><tbody>' +
      moves.map(function(m){
        const plus = m.qtyDelta > 0;
        return '<tr><td class="small">' + localTime(m.at) + '</td><td>' + esc(pname(m.productId)) + '</td>' +
          '<td class="small">' + esc(MOVE_LABEL[m.type] || m.type) + '</td>' +
          '<td class="num strong" style="color:' + (plus ? 'var(--brand)' : 'var(--alert)') + '">' + (plus?'+':'') + qtyText(m.qtyDelta) + '</td>' +
          '<td class="small">' + esc(m.refNo || '—') + '</td><td class="small muted">' + esc(m.note || '') + '</td></tr>';
      }).join('') + '</tbody></table></div></div>'
    : '<div class="card"><div class="empty"><h3>Tidak ada perubahan stok pada tanggal ini</h3></div></div>');

  $('#sd').addEventListener('change', function(){ stockLogDate = this.value; renderView(); });
  const ex = $('[data-expmoves]');

async function adjustDialog(productId){
  const opts = App.products.filter(function(p){ return p.trackStock; });
  if (!opts.length){ toast('Belum ada produk yang dilacak stoknya.', true); return; }
  const body =
    '<div class="field"><label for="ap">Produk</label><select class="input" id="ap">' +
      opts.map(function(p){ return '<option value="' + esc(p.id) + '" ' + (p.id===productId?'selected':'') + '>' + esc(p.name) + ' — sisa ' + qtyText(p.stock) + ' ' + esc(p.unit||'') + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="field" style="margin-top:12px"><label for="at">Jenis perubahan</label><select class="input" id="at">' +
      '<option value="PURCHASE">Barang masuk / pembelian</option>' +
      '<option value="ADJUST">Koreksi jumlah</option>' +
      '<option value="WASTE">Rusak atau terbuang</option>' +
      '<option value="OPNAME">Stok opname (set jumlah akhir)</option>' +
    '</select></div>' +
    '<div class="field" style="margin-top:12px"><label for="aq" id="aql">Jumlah masuk</label><input class="input" id="aq" inputmode="decimal" value="" autofocus></div>' +
    '<div class="field" style="margin-top:12px" id="acw"><label for="ac">Harga beli per satuan</label>' +
      '<input class="input money" id="ac" inputmode="numeric" placeholder="kosongkan jika tidak berubah">' +
      '<div class="hint">Diisi = HPP diperbarui memakai rata-rata bergerak.</div></div>' +
    '<div class="field" style="margin-top:12px"><label for="an">Catatan</label><input class="input" id="an" placeholder="Nomor nota supplier, alasan koreksi, dll"></div>' +
    '<div class="err" id="ae2" hidden style="margin-top:10px"></div>';

  await modal({
    title: 'Catat perubahan stok', body: body,
    footer: '<button class="btn" data-close>Batal</button><button class="btn btn-primary" data-ok>Simpan</button>',
    onMount: function(root){
      const typeSel = root.querySelector('#at');
      const sync = function(){
        const t = typeSel.value;
        root.querySelector('#acw').style.display = (t === 'PURCHASE') ? '' : 'none';
        root.querySelector('#aql').textContent =
          t === 'PURCHASE' ? 'Jumlah masuk' :
          t === 'WASTE'    ? 'Jumlah yang rusak/terbuang' :
          t === 'OPNAME'   ? 'Jumlah hasil hitung fisik' : 'Perubahan (+ atau −)';
      };
      typeSel.addEventListener('change', sync); sync();

      root.querySelector('[data-ok]').addEventListener('click', async function(){
        const err = root.querySelector('#ae2'); err.hidden = true;
        const pid = root.querySelector('#ap').value;
        const type = typeSel.value;
        const raw = Number(String(root.querySelector('#aq').value).replace(',','.'));
        if (!isFinite(raw) || raw === 0){ err.hidden = false; err.textContent = 'Jumlah belum diisi dengan benar.'; return; }
        const p = App.products.find(function(x){ return x.id === pid; });
        let delta = raw, note = root.querySelector('#an').value.trim();
        if (type === 'WASTE') delta = -Math.abs(raw);
        if (type === 'PURCHASE') delta = Math.abs(raw);
        if (type === 'OPNAME'){
          delta = Math.round((raw - (Number(p.stock)||0)) * 1000) / 1000;
          if (delta === 0){ err.hidden = false; err.textContent = 'Jumlah fisik sama dengan catatan. Tidak ada yang perlu dikoreksi.'; return; }
          note = (note ? note + ' — ' : '') + 'opname: catatan ' + qtyText(p.stock) + ' → fisik ' + qtyText(raw);
        }
        try {
          await adjustStock(pid, type === 'OPNAME' ? 'OPNAME' : type, delta,
            type === 'PURCHASE' ? root.querySelector('#ac').value : null, note, App.user);
          await refreshCaches(); closeModal(true); renderView();
          toast('Stok diperbarui.');
        } catch (ex){ err.hidden = false; err.textContent = ex.message; }
      });
    }
  });
}

      '<div class="card"><div class="empty"><h3>Belum ada shift terbuka</h3>' +

            '<td class="small">' + esc(s.openedBy) + '</td><td class="num money">' + Money.plain(s.expectedCash) + '</td>' +
            '<td class="num money">' + Money.plain(s.countedCash) + '</td>' +

      '<div class="card stat"><div class="k">Uang tunai seharusnya</div><div class="v money">' + Money.rp(sum.expectedCash) + '</div><div class="d">termasuk modal ' + Money.rp(sum.opening) + '</div></div>' +
    '</div>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">' +
      '<div class="card"><div class="card-head"><h3>Rincian kas</h3></div><div class="card-pad">' +
        [['Modal awal laci', sum.opening],
         ['Penjualan tunai', sum.cashSales],
         ['Kembalian diberikan', -sum.changeGiven],
         ['Refund tunai', -sum.cashRefunds],
         ['Kas masuk lain', sum.cashIn],
         ['Kas keluar', -sum.cashOut]].map(function(r){
          return '<div class="tl"><span>' + r[0] + '</span><span class="money">' + (r[1]<0?'−':'') + Money.plain(Math.abs(r[1])) + '</span></div>';
        }).join('') +
        '<div class="tl grand"><span>Uang tunai seharusnya</span><span class="money">' + Money.plain(sum.expectedCash) + '</span></div>' +
        (Object.keys(sum.byMethod).length ? '<div class="small muted" style="margin-top:14px">Per metode bayar</div>' +
          Object.keys(sum.byMethod).map(function(m){ return '<div class="tl"><span>' + esc(m) + '</span><span class="money">' + Money.plain(sum.byMethod[m]) + '</span></div>'; }).join('') : '') +
      '</div><div class="card-pad" style="border-top:1px solid var(--line-2);display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn" data-cash="IN">Kas masuk</button>' +
        '<button class="btn" data-cash="OUT">Kas keluar</button>' +
        '<div class="spacer"></div>' +
        '<button class="btn btn-primary" data-closeshift>Tutup shift</button>' +
      '</div></div>' +
      '<div class="card"><div class="card-head"><h3>Catatan kas hari ini</h3></div>' +
      (sum.logs.length ? '<div class="table-wrap" style="max-height:44vh"><table><thead><tr><th>Jam</th><th>Kategori</th><th class="num">Jumlah</th></tr></thead><tbody>' +
        sum.logs.sort(function(a,b){ return b.at.localeCompare(a.at); }).map(function(l){

async function closeShiftDialog(){
  const sum = await shiftSummary(App.shift.id);
  const body =
    '<div class="totals" style="border-radius:10px;margin-bottom:14px">' +
      '<div class="tl"><span>Modal awal</span><span class="money">' + Money.plain(sum.opening) + '</span></div>' +

        inp.value = inp.value ? Money.plain(Money.parse(inp.value)) : '';

      root.querySelector('[data-ok]').addEventListener('click', async function(){
        const counted = Money.parse(inp.value);
        const d = counted - sum.expectedCash;
        if (d !== 0 && !root.querySelector('#cnote').value.trim()){

        }

      });

}

/* ===========================================================================
   16. LAPORAN
   Semua angka dihitung ulang dari nota, bukan dari ringkasan yang disimpan,
   sehingga laporan selalu cocok dengan daftar transaksi.
   =========================================================================== */
let reportRange = { from: daysAgoISO(6), to: localDate() };

async function viewReports(root){
  setHeader('Laporan', 'Omzet dihitung setelah refund dan tanpa nota yang dibatalkan.');
  const all = await dbGetAll('orders');
  const list = all.filter(function(o){
    return o.localDate >= reportRange.from && o.localDate <= reportRange.to && o.status !== 'VOID';
  });

  let omzet = 0, cogs = 0, refunded = 0, disc = 0, tax = 0, service = 0, txn = 0;
  const byDay = {}, byProduct = {}, byCashier = {}, byMethod = {}, byCategory = {};
  const catOf = function(pid){
    const p = App.products.find(function(x){ return x.id === pid; });
    if (!p) return '—';
    const c = App.categories.find(function(x){ return x.id === p.categoryId; });
    return c ? c.name : '—';
  };

  list.forEach(function(o){
    const net = o.grandTotal - (o.refundedAmount || 0);
    omzet += net; refunded += (o.refundedAmount || 0); txn++;
    disc += o.itemDiscount + o.orderDiscount; tax += o.tax; service += o.serviceCharge;
    byDay[o.localDate] = byDay[o.localDate] || { omzet:0, cogs:0, txn:0 };
    byDay[o.localDate].omzet += net;
    byDay[o.localDate].txn++;
    byCashier[o.cashierName] = byCashier[o.cashierName] || { omzet:0, txn:0 };
    byCashier[o.cashierName].omzet += net;
    byCashier[o.cashierName].txn++;
    o.payments.forEach(function(p){ byMethod[p.method] = (byMethod[p.method] || 0) + p.amount; });
    o.items.forEach(function(i){
      const soldQty = i.qty - (i.refundedQty || 0);
      const lineNet = Money.int((i.lineTotal - (i.orderDiscountShare||0)) * (i.qty > 0 ? soldQty / i.qty : 0));
      const lineCogs = Money.int(i.unitCost * soldQty);
      cogs += lineCogs;
      byDay[o.localDate].cogs += lineCogs;
      const k = i.name;
      byProduct[k] = byProduct[k] || { qty:0, omzet:0, cogs:0 };
      byProduct[k].qty += soldQty; byProduct[k].omzet += lineNet; byProduct[k].cogs += lineCogs;
      const c = catOf(i.productId);
      byCategory[c] = byCategory[c] || { qty:0, omzet:0 };
      byCategory[c].qty += soldQty; byCategory[c].omzet += lineNet;
    });
  });
  const profit = omzet - cogs;
  const avg = txn ? Money.int(omzet / txn) : 0;
  const topProducts = Object.keys(byProduct).map(function(k){ return Object.assign({ name:k }, byProduct[k]); })
    .sort(function(a,b){ return b.omzet - a.omzet; });
  const days = Object.keys(byDay).sort();
  const maxDay = days.reduce(function(m,d){ return Math.max(m, byDay[d].omzet); }, 0) || 1;

  root.innerHTML =
    '<div class="card card-pad" style="margin-bottom:14px"><div class="row wrap">' +
      '<div class="field"><label for="rf">Dari</label><input class="input" type="date" id="rf" value="' + reportRange.from + '"></div>' +
      '<div class="field"><label for="rt">Sampai</label><input class="input" type="date" id="rt" value="' + reportRange.to + '"></div>' +
      '<div class="field"><label for="rp">Cepat</label><select class="input" id="rp">' +
        '<option value="">Pilih…</option><option value="0">Hari ini</option><option value="6">7 hari terakhir</option>' +
        '<option value="29">30 hari terakhir</option><option value="m">Bulan ini</option></select></div>' +
      '<div class="spacer"></div>' +
      '<button class="btn btn-sm" data-rexp>Unduh laporan CSV</button>' +
      '<button class="btn btn-sm" data-rprint>Cetak ringkasan</button>' +
    '</div></div>' +

    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-bottom:14px">' +
      '<div class="card stat"><div class="k">Omzet bersih</div><div class="v money">' + Money.rp(omzet) + '</div><div class="d">' + txn + ' nota</div></div>' +
      '<div class="card stat"><div class="k">Laba kotor</div><div class="v money">' + Money.rp(profit) + '</div><div class="d">' + (omzet ? Math.round(profit/omzet*100) : 0) + '% dari omzet</div></div>' +
      '<div class="card stat"><div class="k">HPP terjual</div><div class="v money">' + Money.rp(cogs) + '</div><div class="d">modal barang keluar</div></div>' +
      '<div class="card stat"><div class="k">Rata-rata per nota</div><div class="v money">' + Money.rp(avg) + '</div><div class="d">diskon ' + Money.rp(disc) + '</div></div>' +
      (refunded ? '<div class="card stat"><div class="k">Refund</div><div class="v money">' + Money.rp(refunded) + '</div><div class="d">sudah dipotong dari omzet</div></div>' : '') +
    '</div>' +

    '<div class="card" style="margin-bottom:14px"><div class="card-head"><h3>Omzet per hari</h3></div><div class="card-pad">' +
      (days.length ? days.map(function(d){
        const w = Math.max(2, Math.round(byDay[d].omzet / maxDay * 100));
        return '<div style="margin-bottom:9px">' +
          '<div class="row small"><span style="flex:1">' + fmtDate(d) + '</span>' +
          '<span class="muted tiny">' + byDay[d].txn + ' nota</span>' +
          '<span class="money strong" style="width:110px;text-align:right">' + Money.plain(byDay[d].omzet) + '</span></div>' +
          '<div style="height:7px;background:var(--line-2);border-radius:99px;margin-top:3px;overflow:hidden">' +
          '<div style="height:100%;width:' + w + '%;background:var(--brand);border-radius:99px"></div></div></div>';
      }).join('') : '<div class="empty"><p class="small">Belum ada penjualan pada rentang ini.</p></div>') +
    '</div></div>' +

    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">' +
      reportTable('Produk terlaris', ['Produk','Terjual','Omzet','Laba'],
        topProducts.slice(0,15).map(function(p){
          return [esc(p.name), qtyText(p.qty), Money.plain(p.omzet), Money.plain(p.omzet - p.cogs)];
        })) +
      reportTable('Per kategori', ['Kategori','Terjual','Omzet'],
        Object.keys(byCategory).sort(function(a,b){ return byCategory[b].omzet - byCategory[a].omzet; }).map(function(k){
          return [esc(k), qtyText(byCategory[k].qty), Money.plain(byCategory[k].omzet)];
        })) +
      reportTable('Per kasir', ['Kasir','Nota','Omzet'],
        Object.keys(byCashier).sort(function(a,b){ return byCashier[b].omzet - byCashier[a].omzet; }).map(function(k){
          return [esc(k), String(byCashier[k].txn), Money.plain(byCashier[k].omzet)];
        })) +
      reportTable('Per metode bayar', ['Metode','Diterima'],
        Object.keys(byMethod).sort(function(a,b){ return byMethod[b] - byMethod[a]; }).map(function(k){
          return [esc(k), Money.plain(byMethod[k])];
        })) +
    '</div>';

  $('#rf').addEventListener('change', function(){ reportRange.from = this.value; renderView(); });
  $('#rt').addEventListener('change', function(){ reportRange.to = this.value; renderView(); });
  $('#rp').addEventListener('change', function(){
    const v = this.value;
    if (v === 'm'){ const d = new Date(); reportRange.from = localDate(new Date(d.getFullYear(), d.getMonth(), 1)); reportRange.to = localDate(); }
    else if (v !== ''){ reportRange.from = daysAgoISO(+v); reportRange.to = localDate(); }
    renderView();
  });
  root.addEventListener('click', function(e){
    if (e.target.closest('[data-rexp]')){
      const rows = [['Laporan penjualan', reportRange.from + ' s/d ' + reportRange.to], [],
        ['Omzet bersih', omzet], ['HPP terjual', cogs], ['Laba kotor', profit],
        ['Jumlah nota', txn], ['Rata-rata per nota', avg], ['Total diskon', disc],
        ['Total pajak', tax], ['Total biaya layanan', service], ['Total refund', refunded], [],
        ['Tanggal','Omzet','HPP','Laba','Nota']];
      days.forEach(function(d){ rows.push([d, byDay[d].omzet, byDay[d].cogs, byDay[d].omzet - byDay[d].cogs, byDay[d].txn]); });
      rows.push([], ['Produk','Terjual','Omzet','HPP','Laba']);
      topProducts.forEach(function(p){ rows.push([p.name, qtyText(p.qty), p.omzet, p.cogs, p.omzet - p.cogs]); });
      rows.push([], ['Kasir','Nota','Omzet']);
      Object.keys(byCashier).forEach(function(k){ rows.push([k, byCashier[k].txn, byCashier[k].omzet]); });
      rows.push([], ['Metode bayar','Diterima']);
      Object.keys(byMethod).forEach(function(k){ rows.push([k, byMethod[k]]); });
      downloadFile('laporan-' + reportRange.from + '_' + reportRange.to + '.csv', toCSV(rows), 'text/csv');
      toast('Laporan terunduh.');
    }
    if (e.target.closest('[data-rprint]')){
      $('#receipt-area').innerHTML =
        '<div class="rcpt" style="width:72mm;margin:0 auto">' +
        '<div class="c big">' + esc(App.settings.storeName) + '</div>' +
        '<div class="c">Ringkasan penjualan</div>' +
        '<div class="c">' + fmtDate(reportRange.from) + ' – ' + fmtDate(reportRange.to) + '</div><hr>' +
        '<table><tbody>' +
        [['Nota', String(txn)], ['Omzet bersih', Money.plain(omzet)], ['HPP', Money.plain(cogs)],
         ['Laba kotor', Money.plain(profit)], ['Diskon', Money.plain(disc)], ['Refund', Money.plain(refunded)]]
         .map(function(r){ return '<tr><td>' + r[0] + '</td><td class="r">' + r[1] + '</td></tr>'; }).join('') +
        '</tbody></table><hr><div class="c">Dicetak ' + fmtDateTime(new Date().toISOString()) + '</div></div>';
      setTimeout(function(){ window.print(); }, 60);
    }
  });
}

function reportTable(title, head, rows){
  return '<div class="card"><div class="card-head"><h3>' + esc(title) + '</h3></div>' +
    (rows.length ? '<div class="table-wrap" style="max-height:42vh"><table><thead><tr>' +

/* ---- Panggilan ke /api/users (butuh kunci service role di server Vercel) ---- */
async function adminApi(body){
  const s = await CLOUD.sb.auth.getSession();
  const token = s && s.data && s.data.session ? s.data.session.access_token : '';
  let r;
  try {
    r = await fetch('/api/users', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: JSON.stringify(body)
    });
  } catch (ex){ throw new Error('Server tidak bisa dihubungi. Periksa internet Anda.'); }
  let j = {};
  try { j = await r.json(); } catch (ex){}
  if (!r.ok) throw new Error(j.error || ('Permintaan ditolak server (kode ' + r.status + ').'));
  return j;
}

        const name = root.querySelector('#un').value.trim();
        const pin  = root.querySelector('#up').value.trim();
        if (!name) return fail('Nama wajib diisi.');
        if (pin && !/^\d{6}$/.test(pin)) return fail('PIN harus tepat 6 angka.');
        btn.disabled = true; btn.textContent = 'Menyimpan…';

        try {
          let userId;
          if (isNew){
            const email = root.querySelector('#uem').value.trim();
            const pass  = root.querySelector('#uw').value;
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Email belum benar.');
            if (pass.length < 8) throw new Error('Kata sandi minimal 8 karakter.');
            const res = await adminApi({
              action:'create', email: email, password: pass, name: name,
              role: root.querySelector('#ur').value
            });
            userId = res.userId;
            await reloadUsers();
          } else {
            userId = u.id;
            const np = root.querySelector('#unp');
            if (np && np.value){
              if (np.value.length < 8) throw new Error('Kata sandi minimal 8 karakter.');
              await adminApi({ action:'password', userId: u.id, password: np.value });
            }
          }

          const base = App.users.find(function(x){ return x.id === userId; }) || { id:userId, name:name, role:'CASHIER', active:true };
          const rec = Object.assign({}, base, {
            name: name,
            role: isSelf ? u.role : (isNew ? base.role : root.querySelector('#ur').value),
            active: isNew ? true : (isSelf ? true : root.querySelector('#ua').value === '1')
          });
          if (pin){ const h = await hashPin(pin); rec.pinSalt = h.salt; rec.pinHash = h.hash; }
          await dbPut('users', rec);
          await refreshCaches();
          if (isSelf || rec.id === App.user.id) App.user = rec;
          closeModal(true); renderApp(); toast('Tersimpan.');
        } catch (ex){
          btn.disabled = false; btn.textContent = 'Simpan';
          fail(cloudError(ex).message);
        }
      });
    }
  });
}

async function doRestore(){
  await modal({
    title: 'Pulihkan dari cadangan',
    body: '<p class="small" style="margin:0 0 12px;color:var(--alert)"><span class="strong">Seluruh data di server akan diganti</span> oleh isi berkas cadangan. Unduh cadangan terbaru dulu bila perlu.</p>' +
          '<input type="file" id="rf2" accept=".json,application/json" class="input">' +
          '<div id="rinfo" style="margin-top:12px"></div>' +
          '<div class="err" id="rerr2" hidden style="margin-top:10px"></div>',
    footer: '<button class="btn" data-close>Batal</button><button class="btn btn-danger" data-ok disabled>Ganti semua data</button>',
    onMount: function(root){
      let payload = null;
      root.querySelector('#rf2').addEventListener('change', function(){
        const f = this.files[0]; if (!f) return;
        const fr = new FileReader();
        fr.onload = function(){
          try {
            const d = JSON.parse(String(fr.result));
            if (d.format !== 'pos-offline-backup') throw new Error('Berkas ini bukan cadangan aplikasi kasir.');
            payload = d;
            root.querySelector('#rinfo').innerHTML =
              '<div class="pill ok">Cadangan ' + fmtDateTime(d.at) + '</div>' +
              '<div class="small muted" style="margin-top:8px">' +
              (d.products||[]).length + ' produk · ' + (d.orders||[]).length + ' nota · ' + (d.users||[]).length + ' pengguna</div>';
            root.querySelector('[data-ok]').disabled = false;
          } catch (ex){
            root.querySelector('#rerr2').hidden = false;
            root.querySelector('#rerr2').textContent = ex.message;
          }
        };
        fr.readAsText(f);
      });
      root.querySelector('[data-ok]').addEventListener('click', async function(){
        this.disabled = true; this.textContent = 'Memulihkan…';
        // Akun pengguna tidak ikut dipulihkan: akun hidup di sistem masuk (Auth),
        // bukan di tabel biasa, jadi menimpanya akan memutus semua orang.
        const names = ['categories','products','orders','stockMoves','shifts','cashLogs','parked','meta'];
        const t = tx(names, 'readwrite');
        names.forEach(function(n){ t[n].clear(); });
        (payload.categories||[]).forEach(function(x){ t.categories.put(x); });
        (payload.products||[]).forEach(function(x){ t.products.put(x); });
        (payload.orders||[]).forEach(function(x){ t.orders.put(x); });
        (payload.stockMoves||[]).forEach(function(x){ t.stockMoves.put(x); });
        (payload.shifts||[]).forEach(function(x){ t.shifts.put(x); });
        (payload.cashLogs||[]).forEach(function(x){ t.cashLogs.put(x); });
        (payload.parked||[]).forEach(function(x){ t.parked.put(x); });
        (payload.counters||[]).forEach(function(x){ t.meta.put(x); });
        t.meta.put({ k:'settings', v: payload.settings || DEFAULT_SETTINGS() });
        try {
          await t.done;
          await pullAll();
          await refreshCaches();
          closeModal(true);
          renderApp();
          toast('Data dipulihkan ke server.');
        } catch (ex){ toast('Gagal memulihkan: ' + ex.message, true); }
      });
    }
  });
}

async function wipeDemo(){
  const orders = await dbGetAll('orders');
  const sold = {};
  orders.forEach(function(o){ o.items.forEach(function(i){ sold[i.productId] = true; }); });
  const demoProducts = App.products.filter(function(p){ return p.isDemo && !sold[p.id]; });
  const keptSold = App.products.filter(function(p){ return p.isDemo && sold[p.id]; }).length;
  if (!demoProducts.length){ toast('Tidak ada data contoh yang bisa dihapus.', true); return; }
  const ok = await confirmDialog('Hapus data contoh',
    demoProducts.length + ' produk contoh akan dihapus' + (keptSold ? ' (' + keptSold + ' dipertahankan karena sudah pernah terjual)' : '') + '. Lanjutkan?', 'Hapus', true);
  if (!ok) return;
  const ids = {}; demoProducts.forEach(function(p){ ids[p.id] = true; });
  const t = tx(['products','categories','stockMoves'], 'readwrite');
  demoProducts.forEach(function(p){ t.products.delete(p.id); });
  const moves = await getAll(t.stockMoves);
  moves.forEach(function(m){ if (ids[m.productId] && m.refType !== 'ORDER') t.stockMoves.delete(m.id); });
  const cats = await getAll(t.categories);
  const remaining = App.products.filter(function(p){ return !ids[p.id]; });
  cats.forEach(function(c){
    if (c.isDemo && !remaining.some(function(p){ return p.categoryId === c.id; })) t.categories.delete(c.id);
  });
  await t.done;
  await refreshCaches(); renderView();
  toast('Data contoh dihapus.');
}

async function wipeAll(){
  const ok1 = await confirmDialog('Hapus semua data',
    'Semua produk, nota, stok, dan laporan akan hilang permanen dari server — termasuk di perangkat kasir lain. Akun pengguna tetap dipertahankan.', 'Lanjutkan', true);
  if (!ok1) return;
  const typed = await promptDialog('Konfirmasi terakhir', 'Ketik HAPUS untuk melanjutkan', { hint:'Tindakan ini tidak bisa dibatalkan.' });
  if (String(typed).trim().toUpperCase() !== 'HAPUS'){ toast('Dibatalkan.'); return; }
  const names = ['categories','products','orders','stockMoves','shifts','cashLogs','parked'];
  const t = tx(names.concat(['meta']), 'readwrite');
  names.forEach(function(n){ t[n].clear(); });
  const metas = await getAll(t.meta);
  metas.forEach(function(m){ if (String(m.k).indexOf('seq:') === 0) t.meta.delete(m.k); });
  await t.done;
  await refreshCaches();
  App.shift = null; App.cart = [];
  renderApp();
  toast('Semua data transaksi dan produk dihapus.');
}

function runFormulaTests(){
  const results = [];
  const check = function(name, actual, expected){
    const ok = actual === expected;
    results.push({ name: name, ok: ok, actual: actual, expected: expected });
  };

  check('Rupiah 1.500.000', Money.rp(1500000), 'Rp1.500.000');
  check('Rupiah nol', Money.rp(0), 'Rp0');
  check('Rupiah minus', Money.rp(-2500), '-Rp2.500');
  check('Baca "Rp 15.000"', Money.parse('Rp 15.000'), 15000);
  check('Baca teks kosong', Money.parse(''), 0);
  check('Bulat ke 100 (naik)', Money.roundTo(20450, 100), 20500);
  check('Bulat ke 100 (turun)', Money.roundTo(20449, 100), 20400);
  check('Tanpa pembulatan', Money.roundTo(20449, 0), 20449);
  check('11% dari 20.000', Money.ofBp(20000, 1100), 2200);

  var r = calcTotals({ items:[{price:10000, qty:2, discount:0}], taxBp:1100, taxInclusive:false });
  check('Pajak ditambahkan: subtotal', r.subtotal, 20000);
  check('Pajak ditambahkan: pajak', r.tax, 2200);
  check('Pajak ditambahkan: total', r.grandTotal, 22200);

  r = calcTotals({ items:[{price:10000, qty:2, discount:0}], taxBp:1100, taxInclusive:true });
  check('Pajak termasuk: total tidak bertambah', r.grandTotal, 20000);
  check('Pajak termasuk: pajak diekstrak', r.tax, 1982);
  check('Pajak termasuk: dasar + pajak = total', r.taxBase + r.tax, 20000);

  r = calcTotals({ items:[{price:10000, qty:2}], serviceChargeBp:1000, taxBp:1100, taxInclusive:true });
  check('Termasuk pajak + layanan 10%', r.grandTotal, 22000);
  check('Nilai biaya layanan', r.serviceCharge, 2000);

  r = calcTotals({ items:[{price:10000, qty:2, discount:5000}], orderDiscountBp:1000, orderDiscountAmount:1000 });
  check('Diskon bertingkat: nilai bersih', r.net, 12500);
  check('Diskon bertingkat: total', r.grandTotal, 12500);

  r = calcTotals({ items:[{price:10000, qty:1, discount:99999}], orderDiscountAmount:99999 });
  check('Diskon tidak boleh melebihi nilai', r.net, 0);
  check('Total tidak pernah negatif', r.grandTotal, 0);

  r = calcTotals({ items:[{price:0, qty:3}], taxBp:1100, taxInclusive:true, roundStep:100 });
  check('Nilai nol tidak menghasilkan NaN', r.grandTotal, 0);
  check('Pajak dari nilai nol', r.tax, 0);

  r = calcTotals({ items:[{price:3333, qty:1}], taxBp:1100, taxInclusive:false, roundStep:100 });
  check('Pembulatan total', r.grandTotal, 3700);
  check('Selisih pembulatan tercatat', r.grandTotal - r.grandBeforeRound, r.roundingAdj);

  r = calcTotals({ items:[] });
  check('Keranjang kosong', r.grandTotal, 0);

  var a = allocateProportional(1000, [300, 700]);
  check('Bagi proporsional 1', a[0], 300);
  check('Bagi proporsional 2', a[1], 700);
  a = allocateProportional(100, [1, 1, 1]);
  check('Sisa pembulatan masuk baris terakhir', a[0] + a[1] + a[2], 100);
  a = allocateProportional(500, [0, 0]);
  check('Bobot nol tidak menghasilkan NaN', a[0] + a[1], 0);

  check('Tanggal lokal 12 malam', localDate(new Date(2026, 0, 1, 0, 30)), '2026-01-01');
  check('Tanggal lokal jam 7 pagi', localDate(new Date(2026, 0, 1, 7, 0)), '2026-01-01');
  check('Tanggal lokal jam 11 malam', localDate(new Date(2026, 0, 1, 23, 59)), '2026-01-01');

  return results;
}

async function runDataChecks(){
  const out = [];
  const orders = await dbGetAll('orders');
  const moves = await dbGetAll('stockMoves');
  const products = await dbGetAll('products');

  // 1. Total tersimpan harus sama dengan hitung ulang dari barisnya.
  let bad = 0;
  orders.forEach(function(o){
    const t = calcTotals({
      items: o.items.map(function(i){ return { price:i.unitPrice, qty:i.qty, discount:i.discount }; }),
      orderDiscountAmount: o.orderDiscount, serviceChargeBp: 0,
      taxBp: 0, taxInclusive: false, roundStep: 0
    });
    const expected = Money.int(t.net + o.serviceCharge + (o.taxInclusive ? 0 : o.tax) + o.roundingAdj);
    if (expected !== o.grandTotal) bad++;
  });
  out.push({ name:'Total nota cocok dengan rincian barisnya', ok: bad === 0,
             detail: bad ? bad + ' dari ' + orders.length + ' nota tidak cocok' : orders.length + ' nota diperiksa' });

  // 2. Stok saat ini harus sama dengan jumlah seluruh pergerakan stok.
  const sums = {};
  moves.forEach(function(m){ sums[m.productId] = Math.round(((sums[m.productId] || 0) + m.qtyDelta) * 1000) / 1000; });
  let mismatch = 0, checked = 0;
  products.forEach(function(p){
    if (!p.trackStock) return;
    checked++;
    const s = Math.round((sums[p.id] || 0) * 1000) / 1000;
    if (Math.abs(s - (Number(p.stock) || 0)) > 0.001) mismatch++;
  });
  out.push({ name:'Stok cocok dengan kartu stok', ok: mismatch === 0,
             detail: mismatch ? mismatch + ' produk selisih' : checked + ' produk diperiksa' });

  // 3. Refund tidak boleh melebihi jumlah yang dibeli.
  let over = 0;
  orders.forEach(function(o){ o.items.forEach(function(i){ if ((i.refundedQty || 0) > i.qty + 0.001) over++; }); });
  out.push({ name:'Refund tidak melebihi jumlah pembelian', ok: over === 0,
             detail: over ? over + ' baris melebihi batas' : 'aman' });

  // 4. Pembayaran tidak boleh kurang dari total.
  let under = 0;
  orders.forEach(function(o){
    if (o.status === 'VOID') return;
    const paid = o.payments.reduce(function(a,p){ return a + p.amount; }, 0);
    if (paid < o.grandTotal) under++;
  });
  out.push({ name:'Tidak ada nota yang kurang bayar', ok: under === 0,
             detail: under ? under + ' nota kurang bayar' : 'aman' });

  // 5. Nomor nota tidak boleh kembar.
  const seen = {}; let dup = 0;
  orders.forEach(function(o){ if (seen[o.no]) dup++; seen[o.no] = true; });
  out.push({ name:'Nomor nota unik', ok: dup === 0, detail: dup ? dup + ' nomor kembar' : orders.length + ' nomor diperiksa' });

  return out;
}
