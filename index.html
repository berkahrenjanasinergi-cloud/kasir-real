<title>Kasir — Point of Sale Online</title>
<!--
  ============================================================================
  APLIKASI KASIR (POS) — ONLINE, BISA DIPAKAI BANYAK PERANGKAT
  ============================================================================
  Data     : Postgres di Supabase. Semua perangkat melihat data yang sama dan
             saling menyusul secara realtime.
  Masuk    : email + kata sandi (Supabase Auth). PIN 6 angka dipakai untuk
             membuka kunci layar dan persetujuan manajer di perangkat itu.
  Cetak    : printer Bluetooth (ESC/POS) lewat Web Bluetooth, atau kertas.
  Penyebaran: berkas statis + dua fungsi serverless — pas untuk Vercel.

  YANG PERLU DIPAHAMI SEBELUM DIPAKAI BERJUALAN
  ---------------------------------------------
  1. Aplikasi ini MEMERLUKAN internet. Tidak ada mode luring.
  2. Penjualan, pembatalan, refund, dan koreksi stok dijalankan oleh fungsi di
     dalam basis data, bukan di peramban. Itulah yang membuat dua kasir tidak
     bisa menjual barang terakhir yang sama. Lihat supabase/schema.sql.
  3. Nomor nota diberikan server, berurutan per tanggal, tanpa bentrok.
  4. Semua nominal uang adalah BILANGAN BULAT rupiah. Tidak ada float.
  5. Pengaturan printer disimpan di perangkat masing-masing, bukan di server.

  KONFIGURASI: variabel lingkungan SUPABASE_URL dan SUPABASE_ANON_KEY di
  Vercel, atau diisi lewat layar "Sambungkan ke server" saat pertama dibuka.
  ============================================================================
-->
<style>
/* ---------------------------------------------------------------
   Sistem token. Ubah di sini kalau ingin mengganti tampilan.
   --------------------------------------------------------------- */
:root{
  --paper:#F4F6F3;
  --surface:#FFFFFF;
  --ink:#10201C;
  --ink-2:#4A5B55;
  --ink-3:#7C8C86;
  --line:#DCE3DE;
  --line-2:#EDF1EE;
  --brand:#0B5C4B;
  --brand-2:#08453A;
  --brand-tint:#E4F0EB;
  --alert:#9E2B1B;
  --alert-tint:#FBE9E5;
  --warn:#8A5A00;
  --warn-tint:#FDF0D8;
  --r:10px;
  --r-lg:14px;
  --shadow:0 1px 1px rgba(16,32,28,.04), 0 8px 24px -14px rgba(16,32,28,.35);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:15px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
}

.num,.money,input[inputmode="numeric"],td.num,th.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.012em}
h1{font-size:20px}
h2{font-size:17px}
h3{font-size:15px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}

@media print{
  body{background:#fff}
  #app,#toasts,.scrim{display:none!important}
  #receipt-area{display:block!important}
  @page{margin:4mm}
}

<body>
<div id="app" hidden></div>
<div id="lock"></div>
<div id="modal-root"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="receipt-area" aria-hidden="true"></div>
<script>
"use strict";
/* ===========================================================================
   1. UTILITAS UANG  — semua nominal adalah INTEGER rupiah. Tidak ada float.
   =========================================================================== */
const Money = {
  /** Bulatkan ke bilangan bulat terdekat, aman dari -0. */
  int(n){ const v = Math.round(Number(n) || 0); return v === 0 ? 0 : v; },
  /** Format tampilan: 1500000 -> "Rp1.500.000" */
  rp(n){
    const v = Money.int(n);
    const sign = v < 0 ? '-' : '';
    return sign + 'Rp' + Math.abs(v).toLocaleString('id-ID');
  },
  /** Format tanpa "Rp", untuk kolom tabel dan struk. */
  plain(n){
    const v = Money.int(n);
    return (v < 0 ? '-' : '') + Math.abs(v).toLocaleString('id-ID');
  },
  /** Baca input pengguna: "15.000", "15000", "Rp 15.000" -> 15000 */
  parse(s){
    if (typeof s === 'number') return Money.int(s);
    const cleaned = String(s == null ? '' : s).replace(/[^0-9-]/g, '');
    if (cleaned === '' || cleaned === '-') return 0;
    return Money.int(parseInt(cleaned, 10));
  },
  /**
   * Pembulatan total ke kelipatan tertentu (0 = tidak dibulatkan).
   * Kelipatan .5 dibulatkan ke atas, sesuai kebiasaan kasir.
   */
  roundTo(n, step){
    const v = Money.int(n);
    const s = Money.int(step);
    if (s <= 1) return v;
    return Math.floor(v / s + 0.5) * s;
  },
  /** Persen disimpan sebagai basis poin (1100 = 11,00%) agar bebas float. */
  ofBp(base, bp){
    return Money.int((Money.int(base) * (Number(bp) || 0)) / 10000);
  },
  bpToText(bp){
    const v = (Number(bp) || 0) / 100;
    return (Number.isInteger(v) ? String(v) : v.toFixed(2).replace(/0$/, '')) + '%';
  },
  textToBp(s){
    const v = parseFloat(String(s == null ? '' : s).replace(',', '.'));
    if (!isFinite(v) || v < 0) return 0;
    return Math.round(v * 100);
  }
};

/* ===========================================================================
   2. PERHITUNGAN TOTAL PESANAN  — fungsi murni, diuji di menu "Uji Sistem".

   Urutan: subtotal item -> diskon item -> diskon pesanan -> biaya layanan
           -> pajak -> pembulatan.

   PENTING soal pajak inklusif: kalau harga jual sudah termasuk pajak, pajak
   DIEKSTRAK dari harga, bukan ditambahkan. Grand total tidak boleh membengkak.
   =========================================================================== */
function calcTotals(input){
  const items = Array.isArray(input.items) ? input.items : [];
  const roundStep = Money.int(input.roundStep || 0);

  let subtotal = 0, itemDiscount = 0;
  const lines = [];
  for (const it of items){
    const qty = Number(it.qty) || 0;
    const gross = Money.int(Money.int(it.price) * qty);
    const disc = Math.min(Math.max(Money.int(it.discount), 0), gross);
    subtotal += gross;
    itemDiscount += disc;
    lines.push({ gross: gross, discount: disc, net: gross - disc });
  }
  subtotal = Money.int(subtotal);
  itemDiscount = Money.int(itemDiscount);

  const afterItem = Math.max(0, subtotal - itemDiscount);

  // Diskon pesanan: persen dihitung dulu dari nilai setelah diskon item,
  // lalu ditambah potongan nominal. Tidak boleh melebihi nilai pesanan.
  let orderDiscount = Money.ofBp(afterItem, input.orderDiscountBp || 0);
  orderDiscount += Math.max(0, Money.int(input.orderDiscountAmount));
  orderDiscount = Math.min(orderDiscount, afterItem);

  const net = afterItem - orderDiscount;
  const serviceCharge = Money.ofBp(net, input.serviceChargeBp || 0);

  const taxBp = Number(input.taxBp) || 0;
  const inclusive = !!input.taxInclusive;
  let tax = 0, taxBase = 0, grandBeforeRound = 0;

  if (taxBp <= 0){
    taxBase = net + serviceCharge;
    grandBeforeRound = taxBase;
  } else if (inclusive){
    // Harga sudah mengandung pajak: keluarkan pajaknya, total TIDAK bertambah.
    const gross = net + serviceCharge;
    tax = Money.int(gross - (gross * 10000) / (10000 + taxBp));
    taxBase = gross - tax;
    grandBeforeRound = gross;
  } else {
    taxBase = net + serviceCharge;
    tax = Money.ofBp(taxBase, taxBp);
    grandBeforeRound = taxBase + tax;
  }

  const grandTotal = Money.roundTo(grandBeforeRound, roundStep);
  const roundingAdj = grandTotal - grandBeforeRound;

  return {
    lines: lines,
    subtotal: subtotal,
    itemDiscount: itemDiscount,
    orderDiscount: orderDiscount,
    net: net,
    serviceCharge: serviceCharge,
    taxBase: taxBase,
    tax: tax,
    taxInclusive: inclusive,
    grandBeforeRound: grandBeforeRound,
    roundingAdj: roundingAdj,
    grandTotal: grandTotal
  };
}

/**
 * Bagi pajak ke tiap baris secara proporsional, dengan sisa pembulatan
 * dilimpahkan ke baris terakhir supaya jumlah baris == total pajak.
 * Aman ketika nilai pesanan 0 (tidak ada pembagian dengan nol).
 */
function allocateProportional(total, weights){
  const t = Money.int(total);
  const w = weights.map(function(x){ return Math.max(0, Money.int(x)); });
  const sum = w.reduce(function(a,b){ return a+b; }, 0);
  const out = new Array(w.length).fill(0);
  if (t === 0 || sum === 0) return out;
  let acc = 0;
  for (let i = 0; i < w.length; i++){
    if (i === w.length - 1){ out[i] = t - acc; }
    else { out[i] = Money.int((t * w[i]) / sum); acc += out[i]; }
  }
  return out;
}

/* ===========================================================================
   3. UTILITAS UMUM
   =========================================================================== */
const $  = function(sel, root){ return (root || document).querySelector(sel); };
const $$ = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach(function(_,i){ b[i] = Math.floor(Math.random()*256); });
  return Array.from(b).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/** Tanggal LOKAL perangkat, bukan UTC. Nomor nota harus berganti tengah malam
 *  waktu setempat, bukan pukul 07:00 seperti kalau memakai toISOString(). */
function localDate(d){
  const x = d ? new Date(d) : new Date();
  const p = function(n){ return String(n).padStart(2,'0'); };
  return x.getFullYear() + '-' + p(x.getMonth()+1) + '-' + p(x.getDate());
}
function localTime(d){
  const x = d ? new Date(d) : new Date();
  const p = function(n){ return String(n).padStart(2,'0'); };
  return p(x.getHours()) + ':' + p(x.getMinutes());
}
function fmtDate(iso){
  if (!iso) return '-';
  return new Date(iso).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateTime(iso){
  if (!iso) return '-';
  return new Date(iso).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function qtyText(q){
  const n = Number(q) || 0;
  return Number.isInteger(n) ? String(n) : String(Math.round(n*1000)/1000);
}
function daysAgoISO(n){
  const d = new Date(); d.setDate(d.getDate() - n); return localDate(d);
}
function downloadFile(name, text, mime){
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}
function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function toCSV(rows){
  // Pemisah titik koma + BOM supaya langsung rapi saat dibuka Excel Indonesia.
  return '\uFEFF' + rows.map(function(r){ return r.map(csvCell).join(';'); }).join('\r\n');
}
function parseCSV(text){
  const t = text.replace(/^\uFEFF/, '');
  const delim = (t.split('\n')[0].split(';').length > t.split('\n')[0].split(',').length) ? ';' : ',';
  const rows = []; let row = []; let cur = ''; let q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){
      if (c === '"'){ if (t[i+1] === '"'){ cur += '"'; i++; } else { q = false; } }
      else cur += c;
    } else if (c === '"'){ q = true; }
    else if (c === delim){ row.push(cur); cur = ''; }
    else if (c === '\n'){ row.push(cur); cur = ''; rows.push(row); row = []; }
    else if (c !== '\r'){ cur += c; }
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); });
}

/* Hash PIN: PBKDF2-SHA256. Tidak pernah menyimpan PIN apa adanya. */
async function hashPin(pin, saltHex){
  const enc = new TextEncoder();
  const salt = saltHex ? Uint8Array.from(saltHex.match(/.{2}/g).map(function(h){ return parseInt(h,16); }))
                       : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt: salt, iterations: 210000, hash: 'SHA-256' }, key, 256);
  const hex = function(buf){ return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join(''); };
  return { salt: hex(salt.buffer || salt), hash: hex(bits) };
}
async function verifyPin(pin, saltHex, hashHex){
  if (!saltHex || !hashHex) return false;
  const r = await hashPin(pin, saltHex);
  // Perbandingan waktu tetap.
  if (r.hash.length !== hashHex.length) return false;
  let diff = 0;
  for (let i = 0; i < r.hash.length; i++) diff |= r.hash.charCodeAt(i) ^ hashHex.charCodeAt(i);
  return diff === 0;
}

/* ===========================================================================
   4. PENYIMPANAN (SUPABASE)
   Data tinggal di satu tempat: basis data Postgres di Supabase. Setiap
   perangkat memegang salinan di memori agar layar tetap cepat, lalu
   mendengarkan perubahan secara realtime dari perangkat lain.

   Yang WAJIB atomik — penjualan, pembatalan, refund, koreksi stok — tidak
   dikerjakan di sini, melainkan oleh fungsi di dalam basis data (lihat
   supabase/schema.sql). Itulah yang mencegah dua kasir menjual barang
   terakhir yang sama.
   =========================================================================== */
const CLOUD = {
  url: '', key: '', sb: null, channel: null,
  online: navigator.onLine !== false,
  syncedAt: null,
  historyDays: 400          // rentang nota & pergerakan stok yang dimuat ke memori
};

const TABLES = {
  meta:       { table:'meta',        key:'k'  },
  users:      { table:'profiles',    key:'id' },
  categories: { table:'categories',  key:'id' },
  products:   { table:'products',    key:'id' },
  orders:     { table:'orders',      key:'id' },
  stockMoves: { table:'stock_moves', key:'id' },
  shifts:     { table:'shifts',      key:'id' },
  cashLogs:   { table:'cash_logs',   key:'id' },
  parked:     { table:'parked',      key:'id' }
};
const BY_TABLE = {};
Object.keys(TABLES).forEach(function(n){ BY_TABLE[TABLES[n].table] = n; });

const Cache = {
  meta:[], users:[], categories:[], products:[],
  orders:[], stockMoves:[], shifts:[], cashLogs:[], parked:[]
};

const num = function(v){ return v == null ? 0 : Number(v); };

/* Baris basis data -> objek yang dipakai aplikasi. */
function fromRow(name, r){
  if (!r) return null;
  switch (name){
    case 'meta':  return { k:r.k, v:r.v };
    case 'users': return { id:r.id, name:r.name, role:r.role, active:r.active !== false,
                           pinSalt:r.pin_salt || '', pinHash:r.pin_hash || '', createdAt:r.created_at };
    case 'categories': return { id:r.id, name:r.name, sort:num(r.sort), isDemo:!!r.is_demo };
    case 'products': return {
      id:r.id, sku:r.sku || '', barcode:r.barcode || '', name:r.name,
      categoryId:r.category_id || '', unit:r.unit || '',
      price:num(r.price), cost:num(r.cost), stock:num(r.stock),
      reorderPoint:num(r.reorder_point), trackStock:r.track_stock !== false,
      taxable:r.taxable !== false, active:r.active !== false,
      isDemo:!!r.is_demo, createdAt:r.created_at
    };
    case 'stockMoves': return {
      id:r.id, at:r.at, localDate:r.local_date, productId:r.product_id, type:r.type,
      qtyDelta:num(r.qty_delta), unitCost:num(r.unit_cost), refType:r.ref_type,
      refId:r.ref_id, refNo:r.ref_no || '', userId:r.user_id, note:r.note || ''
    };
    default: return r.data;   // orders, shifts, cashLogs, parked disimpan utuh
  }
}

/* Objek aplikasi -> baris basis data. */
function toRow(name, o){
  switch (name){
    case 'meta':  return { k:o.k, v:o.v, updated_at:new Date().toISOString() };
    case 'users': return { id:o.id, name:o.name, role:o.role, active:o.active !== false,
                           pin_salt:o.pinSalt || null, pin_hash:o.pinHash || null };
    case 'categories': return { id:o.id, name:o.name, sort:num(o.sort), is_demo:!!o.isDemo };
    case 'products': return {
      id:o.id, sku:o.sku || null, barcode:o.barcode || null, name:o.name,
      category_id:o.categoryId || null, unit:o.unit || null,
      price:Money.int(o.price), cost:Money.int(o.cost), stock:num(o.stock),
      reorder_point:num(o.reorderPoint), track_stock:!!o.trackStock,
      taxable:o.taxable !== false, active:o.active !== false,
      is_demo:!!o.isDemo, created_at:o.createdAt || new Date().toISOString(),
      updated_at:new Date().toISOString()
    };
    case 'stockMoves': return {
      id:o.id, at:o.at, local_date:o.localDate, product_id:o.productId, type:o.type,
      qty_delta:num(o.qtyDelta), unit_cost:Money.int(o.unitCost), ref_type:o.refType || null,
      ref_id:o.refId || null, ref_no:o.refNo || '', user_id:o.userId || null, note:o.note || ''
    };
    case 'orders': return {
      id:o.id, client_uuid:o.clientUuid, no:o.no, at:o.at, local_date:o.localDate,
      shift_id:o.shiftId || null, cashier_id:o.cashierId || null, cashier_name:o.cashierName || '',
      status:o.status, grand_total:Money.int(o.grandTotal), data:o,
      updated_at:new Date().toISOString()
    };
    case 'shifts': return {
      id:o.id, status:o.status, opened_at:o.openedAt || null,
      local_date:o.localDate || null, data:o, updated_at:new Date().toISOString()
    };
    case 'cashLogs': return {
      id:o.id, shift_id:o.shiftId || null, local_date:o.localDate || localDate(o.at), data:o
    };
    case 'parked': return { id:o.id, at:o.at, data:o };
  }
  return o;
}

/* Pesan galat dari Postgres dibuat agar bisa dibaca kasir, bukan programmer. */
function cloudError(err){
  const raw = (err && (err.message || err.error_description || err.error)) || String(err);
  const m = String(raw).match(/(STOK|PRODUK|NOTA|AKSES|BENTROK):\s*(.+)/);
  if (m) return new Error(m[2].trim());
  if (/duplicate key.*shifts_single_open/i.test(raw))
    return new Error('Perangkat lain sudah membuka shift. Muat ulang halaman.');
  if (/JWT|session|refresh_token/i.test(raw))
    return new Error('Sesi sudah berakhir. Silakan masuk kembali.');
  if (/Failed to fetch|NetworkError|network/i.test(raw))
    return new Error('Tidak ada sambungan ke server. Periksa internet Anda.');
  return new Error(raw);
}
function must(res){
  if (res && res.error) throw cloudError(res.error);
  return res ? res.data : null;
}

/* ---- Salinan di memori: dibaca semua halaman ---- */
function cacheIndex(name, key){
  const k = TABLES[name].key;
  return Cache[name].findIndex(function(x){ return x[k] === key; });
}
function cacheSet(name, obj){
  if (!obj) return;
  const i = cacheIndex(name, obj[TABLES[name].key]);
  if (i >= 0) Cache[name][i] = obj; else Cache[name].push(obj);
}
function cacheDel(name, key){
  const i = cacheIndex(name, key);
  if (i >= 0) Cache[name].splice(i, 1);
}

async function dbGetAll(name){ return Cache[name].slice(); }
async function dbGet(name, key){
  const i = cacheIndex(name, key);
  return i >= 0 ? Cache[name][i] : undefined;
}
async function dbPut(name, val){
  const cfg = TABLES[name];
  must(await CLOUD.sb.from(cfg.table).upsert(toRow(name, val), { onConflict: cfg.key }));
  cacheSet(name, val);
  return val;
}
async function dbDel(name, key){
  const cfg = TABLES[name];
  must(await CLOUD.sb.from(cfg.table).delete().eq(cfg.key, key));
  cacheDel(name, key);
}

/* ---- Penulisan berkelompok ----
   Bentuknya sengaja dibuat sama dengan transaksi IndexedDB versi lama supaya
   halaman produk, impor CSV, pemulihan cadangan, dan penghapusan data tidak
   perlu ditulis ulang. Bedanya: ini BUKAN transaksi tunggal di server, jadi
   hanya dipakai untuk pekerjaan pengelolaan, bukan untuk penjualan.        */
function rq(p){ return Promise.resolve(p); }
function getAll(store){ return Promise.resolve(Cache[store._name].slice()); }

function tx(stores, mode){
  const names = Array.isArray(stores) ? stores : [stores];
  const ops = [];
  let aborted = false;
  const api = {};
  names.forEach(function(n){
    api[n] = {
      _name: n,
      get: function(key){ return dbGet(n, key); },
      getAll: function(){ return Promise.resolve(Cache[n].slice()); },
      index: function(){ return { get: function(){ return Promise.resolve(undefined); } }; },
      put: function(v){ ops.push({ n:n, op:'put', v:v }); },
      add: function(v){ ops.push({ n:n, op:'put', v:v }); },
      delete: function(k){ ops.push({ n:n, op:'del', k:k }); },
      clear: function(){ ops.push({ n:n, op:'clear' }); }
    };
  });
  api._tx = { abort: function(){ aborted = true; } };
  api.done = {
    then: function(res, rej){
      if (aborted) return Promise.resolve().then(res, rej);
      return flushOps(ops).then(res, rej);
    },
    catch: function(f){ return Promise.resolve(this).catch(f); }
  };
  return api;
}

async function flushOps(ops){
  // Dikelompokkan per tabel supaya sekali jalan, bukan satu permintaan per baris.
  for (const name of Object.keys(TABLES)){
    const mine = ops.filter(function(o){ return o.n === name; });
    if (!mine.length) continue;
    const cfg = TABLES[name];

    if (mine.some(function(o){ return o.op === 'clear'; })){
      must(await CLOUD.sb.from(cfg.table).delete().neq(cfg.key, '__tidak_ada__'));
      Cache[name].length = 0;
    }
    const dels = mine.filter(function(o){ return o.op === 'del'; }).map(function(o){ return o.k; });
    if (dels.length){
      for (let i = 0; i < dels.length; i += 200){
        must(await CLOUD.sb.from(cfg.table).delete().in(cfg.key, dels.slice(i, i+200)));
      }
      dels.forEach(function(k){ cacheDel(name, k); });
    }
    const puts = mine.filter(function(o){ return o.op === 'put'; }).map(function(o){ return o.v; });
    if (puts.length){
      for (let i = 0; i < puts.length; i += 200){
        const chunk = puts.slice(i, i+200);
        must(await CLOUD.sb.from(cfg.table).upsert(chunk.map(function(v){ return toRow(name, v); }),
                                                   { onConflict: cfg.key }));
        chunk.forEach(function(v){ cacheSet(name, v); });
      }
    }
  }
}

/* ---- Tarik seluruh data yang dipakai layar ---- */
async function pullAll(){
  const since = daysAgoISO(CLOUD.historyDays);
  const sel = function(t, build){
    let q = CLOUD.sb.from(t).select('*');
    return build ? build(q) : q;
  };
  const [meta, profiles, cats, prods, ords, moves, shifts, logs, park] = await Promise.all([
    sel('meta'), sel('profiles'), sel('categories'), sel('products'),
    sel('orders', function(q){ return q.gte('local_date', since).order('at', { ascending:false }); }),
    sel('stock_moves', function(q){ return q.gte('local_date', since); }),
    sel('shifts', function(q){ return q.order('opened_at', { ascending:false }).limit(200); }),
    sel('cash_logs', function(q){ return q.gte('local_date', since); }),
    sel('parked')
  ]);
  const fill = function(name, res){
    Cache[name] = (must(res) || []).map(function(r){ return fromRow(name, r); }).filter(Boolean);
  };
  fill('meta', meta); fill('users', profiles); fill('categories', cats); fill('products', prods);
  fill('orders', ords); fill('stockMoves', moves); fill('shifts', shifts);
  fill('cashLogs', logs); fill('parked', park);
  CLOUD.syncedAt = new Date().toISOString();
}

/* ---- Realtime: perubahan dari perangkat lain ---- */
let _rtTimer = null;
function startRealtime(){
  if (CLOUD.channel) return;
  const ch = CLOUD.sb.channel('kasir');
  Object.keys(TABLES).forEach(function(name){
    ch.on('postgres_changes', { event:'*', schema:'public', table:TABLES[name].table }, function(p){
      const cfg = TABLES[name];
      if (p.eventType === 'DELETE'){
        const key = p.old && p.old[cfg.key];
        if (key != null) cacheDel(name, key);
      } else {
        const obj = fromRow(name, p.new);
        if (obj) cacheSet(name, obj);
      }
      CLOUD.syncedAt = new Date().toISOString();
      scheduleRemoteRender();
    });
  });
  ch.subscribe(function(status){
    CLOUD.online = (status === 'SUBSCRIBED');
    paintConnection();
  });
  CLOUD.channel = ch;
}

function scheduleRemoteRender(){
  clearTimeout(_rtTimer);
  _rtTimer = setTimeout(async function(){
    await refreshCaches();
    paintConnection();
    if (!App.user) return;
    if (_modalResolve) return;                    // jangan merusak dialog yang sedang terbuka
    const rs = $('.rail-store'); if (rs) rs.textContent = App.settings.storeName;
    if (App.view === 'pos'){
      // Keranjang milik perangkat ini — jangan disentuh. Cukup segarkan daftar produk.
      if ($('#pos-grid')) { renderPosCats(); renderPosGrid(); }
    } else {
      renderView();
    }
  }, 450);
}

function paintConnection(){
  const el = $('#conn');
  if (!el) return;
  const ok = CLOUD.online && navigator.onLine !== false;
  el.className = 'pill ' + (ok ? 'ok' : 'bad');
  el.textContent = ok ? 'Tersambung' : 'Terputus';
  el.title = CLOUD.syncedAt ? 'Data terakhir masuk ' + fmtDateTime(CLOUD.syncedAt) : '';
}

window.addEventListener('online',  function(){ CLOUD.online = true;  paintConnection(); });
window.addEventListener('offline', function(){ CLOUD.online = false; paintConnection(); });

/* Perubahan stok lokal supaya layar langsung bergerak. Angka yang benar tetap
   datang dari server lewat realtime beberapa saat kemudian. */
function bumpStockLocal(productId, delta){
  const i = cacheIndex('products', productId);
  if (i < 0) return;
  const p = Object.assign({}, Cache.products[i]);
  p.stock = Math.round(((Number(p.stock) || 0) + delta) * 1000) / 1000;
  Cache.products[i] = p;
  const j = App.products.findIndex(function(x){ return x.id === productId; });
  if (j >= 0) App.products[j] = p;
}

/**
 * Menyelesaikan penjualan.
 * Hitungan uang dikerjakan di sini (fungsi murni yang diuji di menu "Uji
 * sistem"), lalu nota dikirim ke fungsi pos_create_sale di basis data.
 * Server yang mengunci baris produk, memeriksa stok sekali lagi, memberi
 * nomor nota, dan menulis semuanya dalam satu transaksi — sehingga dua kasir
 * di perangkat berbeda tidak bisa menjual barang terakhir yang sama.
 * Aman ditekan dua kali: clientUuid yang sama mengembalikan nota yang sama.
 */
async function createSale(payload){
  const now = new Date();
  const dateStr = localDate(now);
  const st = App.settings;

  const items = [];
  for (const line of payload.items){
    const p = App.products.find(function(x){ return x.id === line.productId; });
    if (!p) throw new Error('Produk "' + line.name + '" sudah tidak ada. Hapus dari keranjang.');
    const qty = Number(line.qty) || 0;
    if (qty <= 0) throw new Error('Jumlah untuk "' + p.name + '" tidak valid.');
    if (p.trackStock && !st.allowNegativeStock && (Number(p.stock) || 0) < qty){
      throw new Error('Stok "' + p.name + '" tinggal ' + qtyText(p.stock) + ' ' + (p.unit || '') + '.');
    }
    items.push({
      productId: p.id, name: p.name, sku: p.sku, unit: p.unit,
      unitPrice: Money.int(line.price),
      unitCost: Money.int(p.cost),      // HPP diambil dari data produk, bukan dari layar kasir.
      qty: qty,
      discount: Math.max(0, Money.int(line.discount)),
      taxable: p.taxable !== false,
      trackStock: !!p.trackStock,
      refundedQty: 0
    });
  }

  const totals = calcTotals({
    items: items.map(function(i){ return { price:i.unitPrice, qty:i.qty, discount:i.discount }; }),
    orderDiscountBp: payload.discountBp || 0,
    orderDiscountAmount: payload.discountAmount || 0,
    serviceChargeBp: st.service.enabled ? st.service.bp : 0,
    taxBp: st.tax.enabled ? st.tax.bp : 0,
    taxInclusive: st.tax.inclusive,
    roundStep: st.roundStep
  });

  const payments = (payload.payments || []).map(function(p){
    return { method: String(p.method || 'Tunai'), amount: Money.int(p.amount), ref: String(p.ref || '') };
  }).filter(function(p){ return p.amount > 0; });
  const paid = payments.reduce(function(a,b){ return a + b.amount; }, 0);
  if (paid < totals.grandTotal){
    throw new Error('Pembayaran kurang ' + Money.rp(totals.grandTotal - paid) + '.');
  }
  const cashPaid = payments.filter(function(p){ return p.method === 'Tunai'; })
                           .reduce(function(a,b){ return a + b.amount; }, 0);
  const change = paid - totals.grandTotal;
  if (change > 0 && cashPaid < change){
    throw new Error('Kembalian hanya bisa diberikan dari pembayaran tunai.');
  }

  const weights = items.map(function(i, idx){ return totals.lines[idx].net; });
  const taxAlloc  = allocateProportional(totals.tax, weights);
  const discAlloc = allocateProportional(totals.orderDiscount, weights);

  let cogs = 0;
  items.forEach(function(i, idx){
    i.lineTotal = totals.lines[idx].net;
    i.orderDiscountShare = discAlloc[idx];
    i.taxShare = taxAlloc[idx];
    cogs += Money.int(i.unitCost * i.qty);
  });

  const order = {
    id: uid(),
    clientUuid: payload.clientUuid,
    no: '',                             // nomor diberikan server, berurutan tanpa bentrok
    at: now.toISOString(),
    localDate: dateStr,
    shiftId: App.shift ? App.shift.id : null,
    cashierId: App.user ? App.user.id : null,
    cashierName: App.user ? App.user.name : '-',
    orderType: payload.orderType || '',
    customerName: payload.customerName || '',
    customerPhone: payload.customerPhone || '',
    note: payload.note || '',
    items: items,
    subtotal: totals.subtotal,
    itemDiscount: totals.itemDiscount,
    orderDiscount: totals.orderDiscount,
    serviceCharge: totals.serviceCharge,
    taxName: st.tax.name,
    taxBp: st.tax.enabled ? st.tax.bp : 0,
    taxInclusive: st.tax.inclusive,
    tax: totals.tax,
    roundingAdj: totals.roundingAdj,
    grandTotal: totals.grandTotal,
    cogs: Money.int(cogs),
    payments: payments,
    paid: paid,
    change: change,
    status: 'PAID',
    refunds: [],
    refundedAmount: 0,
    device: DEVICE.name
  };

  const res = must(await CLOUD.sb.rpc('pos_create_sale', {
    p_order: order, p_date: dateStr, p_prefix: st.orderPrefix || ''
  }));
  const saved = res.order;
  cacheSet('orders', saved);
  if (!res.duplicate){
    items.forEach(function(i){ if (i.trackStock) bumpStockLocal(i.productId, -i.qty); });
  }
  return { order: saved, duplicate: !!res.duplicate };
}

/** Batalkan seluruh nota. Hanya untuk nota yang belum pernah di-refund. */
async function voidOrder(orderId, reason, actor){
  const cur = await dbGet('orders', orderId);
  if (!cur) throw new Error('Nota tidak ditemukan.');
  if (cur.status === 'VOID') throw new Error('Nota ini sudah dibatalkan.');
  if ((cur.refundedAmount || 0) > 0) throw new Error('Nota sudah pernah di-refund sebagian. Gunakan refund, bukan batal.');

  const o = JSON.parse(JSON.stringify(cur));
  const at = new Date().toISOString();
  const moves = o.items.filter(function(i){ return i.trackStock; }).map(function(i){
    return {
      id: uid(), at: at, localDate: localDate(at), productId: i.productId,
      type: 'VOID_RETURN', qtyDelta: i.qty, unitCost: i.unitCost,
      refType: 'ORDER', refId: o.id, refNo: o.no, userId: actor.id, note: reason || ''
    };
  });
  o.status = 'VOID';
  o.voidedAt = at; o.voidedBy = actor.name; o.voidReason = reason || '';

  const saved = must(await CLOUD.sb.rpc('pos_apply_order_change', {
    p_id: o.id, p_expected_status: cur.status,
    p_expected_refunded: Money.int(cur.refundedAmount || 0),
    p_order: o, p_moves: moves
  }));
  cacheSet('orders', saved);
  moves.forEach(function(m){ bumpStockLocal(m.productId, m.qtyDelta); });
  return saved;
}

/**
 * Refund sebagian atau penuh.
 * Setiap baris menyimpan refundedQty, sehingga item yang sama TIDAK bisa
 * di-refund berulang kali melebihi jumlah yang benar-benar dibeli.
 */
async function refundOrder(orderId, lines, reason, byCash, actor){
  const cur = await dbGet('orders', orderId);
  if (!cur) throw new Error('Nota tidak ditemukan.');
  if (cur.status === 'VOID') throw new Error('Nota sudah dibatalkan.');

  const o = JSON.parse(JSON.stringify(cur));
  const at = new Date().toISOString();
  const moves = [];
  let amount = 0;
  const applied = [];

  for (const L of lines){
    const item = o.items[L.index];
    if (!item) throw new Error('Baris item tidak ditemukan.');
    const qty = Number(L.qty) || 0;
    if (qty <= 0) continue;
    const remaining = item.qty - (item.refundedQty || 0);
    if (qty > remaining + 1e-9){
      throw new Error('"' + item.name + '" hanya bisa di-refund ' + qtyText(remaining) + ' lagi.');
    }
    // Nilai refund proporsional terhadap nilai yang benar-benar dibayar
    // untuk baris itu (sudah termasuk bagian diskon pesanan).
    const linePaid = item.lineTotal - (item.orderDiscountShare || 0);
    const perUnit = item.qty > 0 ? linePaid / item.qty : 0;
    const lineRefund = Money.int(perUnit * qty);
    amount += lineRefund;

    item.refundedQty = Math.round(((item.refundedQty || 0) + qty) * 1000) / 1000;
    applied.push({ index: L.index, name: item.name, qty: qty, amount: lineRefund });

    if (item.trackStock){
      moves.push({
        id: uid(), at: at, localDate: localDate(at), productId: item.productId,
        type: 'REFUND_RETURN', qtyDelta: qty, unitCost: item.unitCost,
        refType: 'ORDER', refId: o.id, refNo: o.no, userId: actor.id, note: reason || ''
      });
    }
  }
  if (amount <= 0) throw new Error('Tidak ada item yang dipilih untuk refund.');

  o.refunds = o.refunds || [];
  o.refunds.push({
    id: uid(), at: at, by: actor.name, byId: actor.id,
    shiftId: App.shift ? App.shift.id : null,
    amount: amount, cash: !!byCash, reason: reason || '', items: applied
  });
  o.refundedAmount = Money.int((o.refundedAmount || 0) + amount);
  const fullyRefunded = o.items.every(function(i){ return (i.refundedQty || 0) >= i.qty - 1e-9; });
  o.status = fullyRefunded ? 'REFUNDED' : 'PARTIAL_REFUND';

  const saved = must(await CLOUD.sb.rpc('pos_apply_order_change', {
    p_id: o.id, p_expected_status: cur.status,
    p_expected_refunded: Money.int(cur.refundedAmount || 0),
    p_order: o, p_moves: moves
  }));
  cacheSet('orders', saved);
  moves.forEach(function(m){ bumpStockLocal(m.productId, m.qtyDelta); });
  return { order: saved, amount: amount };
}

/** Penyesuaian stok manual (koreksi, barang rusak, penerimaan barang). */
async function adjustStock(productId, type, qtyDelta, unitCost, note, actor){
  const p = await dbGet('products', productId);
  if (!p) throw new Error('Produk tidak ditemukan.');
  const delta = Number(qtyDelta) || 0;
  if (delta === 0) throw new Error('Jumlah tidak boleh nol.');

  // HPP rata-rata bergerak: hanya diperbarui saat barang MASUK dengan harga beli.
  let newCost = null;
  let moveCost = Money.int(p.cost);
  if (type === 'PURCHASE' && delta > 0 && unitCost != null && unitCost !== ''){
    const cost = Money.int(unitCost);
    const oldQty = Math.max(0, Number(p.stock) || 0);
    newCost = (oldQty + delta) > 0
      ? Money.int((oldQty * Money.int(p.cost) + delta * cost) / (oldQty + delta))
      : cost;
    moveCost = cost;
  }

  const at = new Date().toISOString();
  const row = must(await CLOUD.sb.rpc('pos_adjust_stock', {
    p_product_id: productId,
    p_delta: delta,
    p_new_cost: newCost,
    p_move: {
      id: uid(), at: at, localDate: localDate(at), type: type,
      unitCost: moveCost, refType: 'MANUAL', refId: null, refNo: '',
      userId: actor.id, note: note || ''
    }
  }));
  const saved = fromRow('products', row);
  cacheSet('products', saved);
  return saved;
}

/* ---- Shift (buka/tutup kasir) ---- */
async function openShift(openingFloat, actor){
  if (App.shift) throw new Error('Masih ada shift yang terbuka.');
  const at = new Date().toISOString();
  const s = {
    id: uid(), status:'OPEN', openedAt: at, localDate: localDate(at),
    openedBy: actor.name, openedById: actor.id,
    openingFloat: Money.int(openingFloat),
    closedAt: null, closedBy: null, countedCash: 0, expectedCash: 0, variance: 0, note: ''
  };
  await dbPut('shifts', s);
  App.shift = s;
  return s;
}

/** Ringkasan kas sebuah shift — INI yang dipakai saat tutup kasir. */
async function shiftSummary(shiftId){
  const allOrders = await dbGetAll('orders');
  const orders = allOrders.filter(function(o){ return o.shiftId === shiftId; });
  const logs = (await dbGetAll('cashLogs')).filter(function(l){ return l.shiftId === shiftId; });
  const shift = await dbGet('shifts', shiftId);

  let cashSales = 0, nonCashSales = 0, grossSales = 0, cogs = 0, txCount = 0, changeGiven = 0;
  const byMethod = {};
  orders.forEach(function(o){
    if (o.status === 'VOID') return;
    txCount++;
    grossSales += o.grandTotal;
    cogs += o.cogs;
    o.payments.forEach(function(p){
      byMethod[p.method] = (byMethod[p.method] || 0) + p.amount;
      if (p.method === 'Tunai') cashSales += p.amount; else nonCashSales += p.amount;
    });
    changeGiven += o.change || 0;
  });
  // Refund yang dibayarkan tunai pada shift ini mengurangi isi laci.
  let cashRefunds = 0, nonCashRefunds = 0;
  allOrders.forEach(function(o){
    (o.refunds || []).forEach(function(r){
      if (r.shiftId !== shiftId) return;
      if (r.cash) cashRefunds += r.amount; else nonCashRefunds += r.amount;
    });
  });
  let cashIn = 0, cashOut = 0;
  logs.forEach(function(l){ if (l.type === 'IN') cashIn += l.amount; else cashOut += l.amount; });

  const opening = shift ? shift.openingFloat : 0;
  const netCashSales = cashSales - changeGiven;   // uang tunai yang benar-benar masuk laci
  const expectedCash = opening + netCashSales - cashRefunds + cashIn - cashOut;

  return {
    shift: shift, orders: orders, logs: logs,
    txCount: txCount, grossSales: grossSales, cogs: cogs,
    grossProfit: grossSales - cogs,
    cashSales: cashSales, changeGiven: changeGiven, netCashSales: netCashSales,
    nonCashSales: nonCashSales, byMethod: byMethod,
    cashRefunds: cashRefunds, nonCashRefunds: nonCashRefunds,
    cashIn: cashIn, cashOut: cashOut,
    opening: opening, expectedCash: expectedCash
  };
}
async function closeShift(shiftId, countedCash, note, actor){
  const sum = await shiftSummary(shiftId);
  const s = sum.shift;
  if (!s || s.status !== 'OPEN') throw new Error('Shift tidak ditemukan atau sudah ditutup.');
  s.status = 'CLOSED';
  s.closedAt = new Date().toISOString();
  s.closedBy = actor.name;
  s.countedCash = Money.int(countedCash);
  s.expectedCash = Money.int(sum.expectedCash);
  s.variance = s.countedCash - s.expectedCash;
  s.note = note || '';
  s.snapshot = {
    txCount: sum.txCount, grossSales: sum.grossSales, cogs: sum.cogs,
    cashSales: sum.cashSales, changeGiven: sum.changeGiven,
    nonCashSales: sum.nonCashSales, cashRefunds: sum.cashRefunds,
    cashIn: sum.cashIn, cashOut: sum.cashOut, opening: sum.opening
  };
  await dbPut('shifts', s);
  App.shift = null;
  return s;
}

/* ===========================================================================
   8. KOMPONEN UI DASAR

function toast(msg, bad){
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(function(){ el.remove(); }, bad ? 4200 : 2600);
}

let _modalResolve = null;
function closeModal(value){
  const r = _modalResolve; _modalResolve = null;
  const root = $('#modal-root');
  const fresh = root.cloneNode(false);   // buang seluruh listener dialog sebelumnya
  root.replaceWith(fresh);
  if (r) r(value);
}
/**
 * Menampilkan dialog. opts = { title, body, footer, wide, onMount }
 * Mengembalikan Promise yang selesai saat dialog ditutup.
 */
function modal(opts){
  return new Promise(function(resolve){
    if (_modalResolve) closeModal(null);
    _modalResolve = resolve;
    const stale = $('#modal-root');
    const root = stale.cloneNode(false);
    stale.replaceWith(root);
    root.innerHTML =
      '<div class="scrim" data-scrim>' +
        '<div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title || '') + '">' +
          '<div class="modal-head"><h2>' + esc(opts.title || '') + '</h2><div class="spacer"></div>' +
            '<button class="btn btn-ghost btn-sm" data-close aria-label="Tutup">✕</button></div>' +
          '<div class="modal-body">' + (opts.body || '') + '</div>' +
          (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
        '</div>' +
      '</div>';
    root.addEventListener('click', function(e){
      if (e.target.hasAttribute('data-scrim') || e.target.closest('[data-close]')) closeModal(null);
    });
    if (opts.onMount) opts.onMount(root);
    const first = root.querySelector('[autofocus],input,select,textarea,button');
    if (first) setTimeout(function(){ first.focus(); }, 30);
  });
}
function confirmDialog(title, message, okLabel, danger){
  return modal({
    title: title,
    body: '<p style="margin:0">' + esc(message) + '</p>',
    footer: '<button class="btn" data-close>Batal</button>' +
            '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-ok>' + esc(okLabel || 'Lanjutkan') + '</button>',
    onMount: function(root){
      root.querySelector('[data-ok]').addEventListener('click', function(){ closeModal(true); });
    }
  });
}
function promptDialog(title, label, opts){
  opts = opts || {};
  return modal({
    title: title,
    body: '<div class="field"><label for="pv">' + esc(label) + '</label>' +
          '<input class="input" id="pv" autofocus value="' + esc(opts.value || '') + '" ' +
          (opts.numeric ? 'inputmode="numeric"' : '') + '>' +
          (opts.hint ? '<div class="hint">' + esc(opts.hint) + '</div>' : '') + '</div>',
    footer: '<button class="btn" data-close>Batal</button><button class="btn btn-primary" data-ok>Simpan</button>',
    onMount: function(root){
      const inp = root.querySelector('#pv');
      const ok = function(){ closeModal(inp.value); };
      root.querySelector('[data-ok]').addEventListener('click', ok);
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') ok(); });
    }
  });
}

/** Minta persetujuan pengguna berperan lebih tinggi (untuk batal/refund). */
async function requireApproval(permKey, reasonLabel){
  if (can(App.user, permKey)) return App.user;
  const eligible = App.users.filter(function(u){ return u.active !== false && !!u.pinHash && can(u, permKey); });
  if (!eligible.length){ toast('Tidak ada manajer ber-PIN di toko ini. Atur PIN lewat halaman Printer.', true); return null; }
  const body =
    '<p class="small muted" style="margin:0 0 12px">Tindakan ini perlu persetujuan ' +
    esc(reasonLabel || 'manajer') + '.</p>' +
    '<div class="field"><label for="au">Pengguna</label><select class="input" id="au">' +
    eligible.map(function(u){ return '<option value="' + esc(u.id) + '">' + esc(u.name) + ' — ' + esc(ROLES[u.role].label) + '</option>'; }).join('') +
    '</select></div>' +
    '<div class="field" style="margin-top:12px"><label for="ap">PIN</label>' +
    '<input class="input" id="ap" type="password" inputmode="numeric" autocomplete="off" autofocus></div>' +
    '<div class="err" id="ae" hidden></div>';
  const res = await modal({
    title: 'Persetujuan diperlukan',
    body: body,
    footer: '<button class="btn" data-close>Batal</button><button class="btn btn-primary" data-ok>Setujui</button>',
    onMount: function(root){
      const go = async function(){
        const u = App.users.find(function(x){ return x.id === root.querySelector('#au').value; });
        const ok = u && await verifyPin(root.querySelector('#ap').value, u.pinSalt, u.pinHash);
        if (!ok){
          const e = root.querySelector('#ae'); e.hidden = false; e.textContent = 'PIN salah.';
          root.querySelector('#ap').value = ''; root.querySelector('#ap').focus();
          return;
        }
        closeModal(u);
      };
      root.querySelector('[data-ok]').addEventListener('click', go);
      root.querySelector('#ap').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
    }
  });
  return res || null;
}

   9. MASUK (SUPABASE AUTH) & KUNCI LAYAR
   Masuk memakai email + kata sandi. PIN 6 angka tetap ada, tapi sekarang
   perannya jelas: pembuka kunci layar cepat dan persetujuan manajer di
   perangkat yang sedang dipakai — bukan pengganti kata sandi akun.
   =========================================================================== */
const DEVICE = (function(){
  let id = localStorage.getItem('kasir.deviceId');
  if (!id){ id = uid(); localStorage.setItem('kasir.deviceId', id); }
  let name = localStorage.getItem('kasir.deviceName') || '';
  if (!name){
    name = /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Perangkat genggam' : 'Komputer kasir';
    localStorage.setItem('kasir.deviceName', name);
  }
  return { id: id, name: name };
})();

let authMode = 'login';         // 'login' | 'setup'
let authBusy = false;
let lockState = { userId:null, pin:'', error:'' };

function authShell(inner){
  $('#app').hidden = true;
  const wrap = $('#lock');
  wrap.hidden = false;

function renderAuth(message, bad){
  const msg = message
    ? '<div class="' + (bad ? 'err' : 'hint') + '" style="margin-top:10px">' + esc(message) + '</div>'
    : '';

  if (authMode === 'setup'){
    authShell(
      '<h1>Siapkan toko</h1>' +
      '<p class="small muted" style="margin:6px 0 18px">Akun pertama menjadi pemilik. Karyawan lain ditambahkan nanti lewat Pengaturan.</p>' +
      '<div class="field"><label for="fs">Nama usaha</label><input class="input" id="fs" autofocus placeholder="Warung Bu Tini"></div>' +
      '<div class="field" style="margin-top:12px"><label for="fn">Nama Anda</label><input class="input" id="fn" placeholder="Tini"></div>' +
      '<div class="field" style="margin-top:12px"><label for="fe2">Email</label><input class="input" id="fe2" type="email" autocomplete="username" placeholder="nama@email.com"></div>' +
      '<div class="field" style="margin-top:12px"><label for="fw">Kata sandi</label>' +
      '<input class="input" id="fw" type="password" autocomplete="new-password" placeholder="minimal 8 karakter"></div>' +
      '<div class="field" style="margin-top:12px"><label for="fd">Isi dengan produk contoh?</label>' +
      '<select class="input" id="fd"><option value="1">Ya, isi 30 produk contoh untuk mencoba</option>' +
      '<option value="0">Tidak, saya mulai dari kosong</option></select></div>' +
      '<div class="err" id="fe" hidden style="margin-top:10px"></div>' +
      '<button class="btn btn-primary btn-lg btn-block" id="fgo" style="margin-top:18px">Buat toko</button>' +
      '<button class="btn btn-ghost btn-block" id="login-back" style="margin-top:8px">Sudah punya akun</button>' +
      msg
    );
    const enter = function(e){ if (e.key === 'Enter') doFirstRun(); };
    ['fs','fn','fe2','fw'].forEach(function(id){ $('#'+id).addEventListener('keydown', enter); });
    $('#fgo').addEventListener('click', doFirstRun);

  }

  authShell(
    '<h1>Masuk</h1>' +
    '<p class="small muted" style="margin:6px 0 18px">Data toko tersimpan di server, jadi Anda bisa masuk dari perangkat mana saja.</p>' +
    '<div class="field"><label for="le">Email</label>' +
    '<input class="input" id="le" type="email" autocomplete="username" autofocus value="' +
      esc(localStorage.getItem('kasir.lastEmail') || '') + '"></div>' +
    '<div class="field" style="margin-top:12px"><label for="lw">Kata sandi</label>' +
    '<input class="input" id="lw" type="password" autocomplete="current-password"></div>' +
    '<div class="err" id="lerr" hidden style="margin-top:10px"></div>' +
    '<button class="btn btn-primary btn-lg btn-block" id="login-go" style="margin-top:18px">Masuk</button>' +
    '<button class="btn btn-ghost btn-block" id="login-reset" style="margin-top:8px">Lupa kata sandi</button>' +
    '<div id="setup-slot"></div>' + msg
  );
  const enter = function(e){ if (e.key === 'Enter') doSignIn(); };
  $('#le').addEventListener('keydown', enter);
  $('#lw').addEventListener('keydown', enter);
  $('#login-go').addEventListener('click', doSignIn);
  $('#login-reset').addEventListener('click', doResetPassword);

  // Toko yang belum punya pemilik: tawarkan penyiapan.
  CLOUD.sb.rpc('pos_needs_setup').then(function(r){
    if (r && r.data === true && $('#setup-slot')){
      $('#setup-slot').innerHTML =
        '<hr style="border:0;border-top:1px solid var(--line-2);margin:18px 0">' +
        '<p class="small muted" style="margin:0 0 10px">Toko ini belum punya pemilik.</p>' +
        '<button class="btn btn-block" id="login-setup">Siapkan toko baru</button>';
      $('#login-setup').addEventListener('click', function(){ authMode = 'setup'; renderAuth(); });
    }
  }, function(){});
}

function authFail(msg){
  const e = $('#lerr') || $('#fe');
  if (e){ e.hidden = false; e.textContent = msg; }
}

async function doSignIn(){
  if (authBusy) return;
  const email = ($('#le').value || '').trim();
  const pass  = $('#lw').value || '';
  if (!email || !pass) return authFail('Email dan kata sandi wajib diisi.');
  authBusy = true;
  const btn = $('#login-go'); btn.disabled = true; btn.textContent = 'Memeriksa…';
  try {
    const res = await CLOUD.sb.auth.signInWithPassword({ email: email, password: pass });
    if (res.error) throw res.error;
    localStorage.setItem('kasir.lastEmail', email);
    await enterApp();
  } catch (ex){
    const m = String(ex.message || ex);
    authFail(/Invalid login/i.test(m) ? 'Email atau kata sandi salah.'
           : /Email not confirmed/i.test(m) ? 'Email belum dikonfirmasi. Buka tautan di email Anda.'
           : cloudError(ex).message);
    const b = $('#login-go'); if (b){ b.disabled = false; b.textContent = 'Masuk'; }
  } finally { authBusy = false; }
}

async function doResetPassword(){
  const email = ($('#le').value || '').trim();
  if (!email) return authFail('Isi email dulu, lalu tekan tombol ini.');
  const res = await CLOUD.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
  if (res.error) return authFail(cloudError(res.error).message);
  renderAuth('Tautan penggantian kata sandi dikirim ke ' + email + '.');
}

/** Penyiapan pertama: buat akun pemilik, tulis pengaturan, isi data contoh. */
async function doFirstRun(){
  if (authBusy) return;
  const store = $('#fs').value.trim();
  const name  = $('#fn').value.trim();
  const email = $('#fe2').value.trim();
  const pass  = $('#fw').value;
  const seed  = $('#fd').value === '1';
  const err   = $('#fe');
  const fail = function(m){ err.hidden = false; err.textContent = m; authBusy = false;
                            const b = $('#fgo'); if (b){ b.disabled = false; b.textContent = 'Buat toko'; } };
  err.hidden = true;
  if (!store) return fail('Nama usaha belum diisi.');
  if (!name)  return fail('Nama Anda belum diisi.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('Email belum benar.');
  if (pass.length < 8) return fail('Kata sandi minimal 8 karakter.');

  authBusy = true;
  const btn = $('#fgo'); btn.disabled = true; btn.textContent = 'Menyiapkan…';

  try {
    const res = await CLOUD.sb.auth.signUp({ email: email, password: pass, options:{ data:{ name: name } } });
    if (res.error) throw res.error;
    if (!res.data.session){
      authMode = 'login';
      renderAuth('Akun dibuat. Konfirmasi lewat email dulu, lalu masuk. (Konfirmasi email bisa dimatikan di Supabase → Authentication → Providers.)');
      authBusy = false;
      return;
    }
    localStorage.setItem('kasir.lastEmail', email);
    splash('Menyiapkan toko…', 'Sebentar, sedang menulis data awal.');

    const st = DEFAULT_SETTINGS();
    st.storeName = store;
    await dbPut('meta', { k:'settings', v: st });

    if (seed){
      const d = demoData();
      const at = new Date().toISOString();
      const t = tx(['categories','products','stockMoves'], 'readwrite');
      d.categories.forEach(function(c){ t.categories.add(c); });
      d.products.forEach(function(p){
        t.products.add(p);
        if (p.trackStock && p.stock > 0){
          t.stockMoves.add({ id:uid(), at:at, localDate:localDate(at), productId:p.id,
            type:'OPENING', qtyDelta:p.stock, unitCost:p.cost, refType:'SEED', refId:null,
            refNo:'', userId:null, note:'Stok awal data contoh' });
        }
      });
      await t.done;
    }
    authBusy = false;
    await enterApp();
    toast('Toko siap dipakai.');
  } catch (ex){
    authBusy = false;
    fail(cloudError(ex).message);
  }
}

/** Sudah punya sesi: tarik data, kenali profil, nyalakan realtime. */
async function enterApp(){
  splash('Memuat data toko…', 'Mengambil produk, nota, dan pengaturan.');
  const ures = await CLOUD.sb.auth.getUser();
  const authUser = ures && ures.data ? ures.data.user : null;
  if (!authUser){ authMode = 'login'; renderAuth('Sesi tidak ditemukan. Masuk kembali.', true); return; }

  try {
    await pullAll();
  } catch (ex){
    authMode = 'login';
    renderAuth(cloudError(ex).message, true);
    return;
  }
  await refreshCaches();

  const me = App.users.find(function(u){ return u.id === authUser.id; });
  if (!me){
    await CLOUD.sb.auth.signOut();
    authMode = 'login';
    renderAuth('Akun ini belum terdaftar sebagai karyawan toko. Minta pemilik menambahkannya.', true);
    return;
  }
  if (me.active === false){
    await CLOUD.sb.auth.signOut();
    authMode = 'login';
    renderAuth('Akun Anda dinonaktifkan. Hubungi pemilik toko.', true);
    return;
  }

  App.user = me;
  me.email = authUser.email;
  startRealtime();
  lockState = { userId:null, pin:'', error:'' };
  $('#lock').hidden = true;
  $('#lock').innerHTML = '';
  $('#app').hidden = false;
  App.view = can(me, 'pos') ? 'pos' : 'reports';
  renderApp();
  paintConnection();
}

function unlockApp(){

  $('#lock').hidden = true;
  $('#lock').innerHTML = '';
  $('#app').hidden = false;
  renderApp();
}

async function tryPin(){
  const u = App.user;
  const ok = u && await verifyPin(lockState.pin, u.pinSalt, u.pinHash);
  if (!ok){
    lockState.pin = ''; lockState.error = 'PIN salah. Coba lagi.';
    renderLock();
    return;
  }
  unlockApp();
}

function lockApp(){
  lockState = { userId:null, pin:'', error:'' };
  renderLock();
}

async function signOutAndReset(){
  if (App.cart.length){
    const ok = await confirmDialog('Keluar akun', 'Keranjang yang belum dibayar akan hilang. Keluar sekarang?', 'Keluar', true);
    if (!ok) return;
  }
  try { if (CLOUD.channel){ await CLOUD.sb.removeChannel(CLOUD.channel); CLOUD.channel = null; } } catch(e){}
  try { await CLOUD.sb.auth.signOut(); } catch(e){}
  App.user = null; App.cart = [];
  App.cartMeta = { orderType:'', customerName:'', customerPhone:'', note:'', discountBp:0, discountAmount:0 };
  authMode = 'login';
  renderAuth('Anda sudah keluar.');
}

function cartTotals(){
  const st = App.settings;
  return calcTotals({
    items: App.cart.map(function(c){ return { price:c.price, qty:c.qty, discount:c.discount }; }),
    orderDiscountBp: App.cartMeta.discountBp,
    orderDiscountAmount: App.cartMeta.discountAmount,
    serviceChargeBp: st.service.enabled ? st.service.bp : 0,
    taxBp: st.tax.enabled ? st.tax.bp : 0,
    taxInclusive: st.tax.inclusive,
    roundStep: st.roundStep
  });
}

function viewPOS(root){
  const st = App.settings;
  setHeader('Kasir', App.shift
      ? 'Shift dibuka ' + localTime(App.shift.openedAt) + ' oleh ' + App.shift.openedBy
      : 'Belum ada shift terbuka — buka shift agar kas bisa dihitung saat tutup',
    (App.parkedCount ? '<button class="btn btn-sm" data-parked>Nota ditahan (' + App.parkedCount + ')</button>' : '') +
    (App.shift ? '' : '<button class="btn btn-sm btn-primary" data-openshift>Buka shift</button>')
  );

  root.innerHTML =
    '<div class="pos">' +
      '<section>' +
        '<div class="pos-tools">' +
          '<input class="input" id="pos-q" placeholder="Cari nama atau SKU…  (F2)" style="flex:2 1 220px" autocomplete="off">' +
          '<input class="input" id="pos-barcode" placeholder="Pindai barcode…" style="flex:1 1 170px" autocomplete="off">' +
        '</div>' +
        '<div class="cat-bar" id="pos-cats"></div>' +
        '<div id="pos-grid"></div>' +
      '</section>' +
      '<aside class="card cart">' +
        '<div class="card-head"><h2>Keranjang</h2><span class="pill" id="cart-count">0 item</span>' +
        '<button class="btn btn-ghost btn-sm" data-clearcart title="Kosongkan">🗑</button></div>' +
        '<div class="cart-items" id="cart-items"></div>' +
        '<div id="cart-foot"></div>' +
      '</aside>' +
    '</div>';

  renderPosCats();
  renderPosGrid();
  renderCart();

  const q = $('#pos-q');
  q.value = App.posFilter.q;
  q.addEventListener('input', function(){ App.posFilter.q = q.value; renderPosGrid(); });
  $('#pos-barcode').addEventListener('keydown', function(e){
    if (e.key !== 'Enter') return;
    const code = e.target.value.trim();
    e.target.value = '';
    if (!code) return;
    const p = App.products.find(function(x){ return x.active !== false && (x.barcode === code || x.sku === code); });
    if (!p){ toast('Barcode "' + code + '" tidak terdaftar.', true); return; }
    addToCart(p.id);
  });
}

function renderPosCats(){
  const el = $('#pos-cats'); if (!el) return;
  el.innerHTML =
    '<button data-cat="" aria-pressed="' + (App.posFilter.categoryId === '' ? 'true':'false') + '">Semua</button>' +
    App.categories.map(function(c){
      return '<button data-cat="' + esc(c.id) + '" aria-pressed="' + (App.posFilter.categoryId === c.id ? 'true':'false') + '">' + esc(c.name) + '</button>';
    }).join('');
}

function posVisibleProducts(){
  const q = App.posFilter.q.trim().toLowerCase();
  return App.products.filter(function(p){
    if (p.active === false) return false;
    if (App.posFilter.categoryId && p.categoryId !== App.posFilter.categoryId) return false;
    if (!q) return true;
    return (p.name || '').toLowerCase().indexOf(q) >= 0 ||
           (p.sku || '').toLowerCase().indexOf(q) >= 0 ||
           (p.barcode || '').toLowerCase().indexOf(q) >= 0;
  });
}

function renderPosGrid(){
  const el = $('#pos-grid'); if (!el) return;
  const list = posVisibleProducts();
  if (!list.length){
    el.innerHTML = '<div class="empty"><h3>Tidak ada produk yang cocok</h3>' +
      '<p class="small">Ubah kata pencarian, atau tambahkan produk lewat menu Produk.</p></div>';
    return;
  }
  el.innerHTML = '<div class="prod-grid">' + list.map(function(p){
    const inCart = App.cart.filter(function(c){ return c.productId === p.id; })
                           .reduce(function(a,c){ return a + c.qty; }, 0);
    const avail = (Number(p.stock) || 0) - inCart;
    const rp = Number(p.reorderPoint) || 0;
    let stockTxt = 'Tanpa stok', cls = '';
    if (p.trackStock){
      stockTxt = 'Sisa ' + qtyText(avail) + ' ' + (p.unit || '');
      if (avail <= 0){ cls = 'out'; stockTxt = 'Habis'; }
      else if (avail <= rp) cls = 'low';
    }
    const blocked = p.trackStock && avail <= 0 && !App.settings.allowNegativeStock;
    return '<button class="prod" data-add="' + esc(p.id) + '" ' + (blocked ? 'disabled' : '') + '>' +
      '<span class="pn">' + esc(p.name) + '</span>' +
      '<span class="pp">' + Money.rp(p.price) + '</span>' +
      '<span class="ps ' + cls + '">' + esc(stockTxt) + '</span></button>';
  }).join('') + '</div>';
}

function addToCart(productId, qty){
  const p = App.products.find(function(x){ return x.id === productId; });
  if (!p) return;
  const add = Number(qty) || 1;
  const line = App.cart.find(function(c){ return c.productId === productId && !c.priceEdited; });
  const inCart = App.cart.filter(function(c){ return c.productId === productId; })
                         .reduce(function(a,c){ return a + c.qty; }, 0);
  if (p.trackStock && !App.settings.allowNegativeStock && inCart + add > (Number(p.stock) || 0)){
    toast('Stok "' + p.name + '" hanya ' + qtyText(p.stock) + '.', true);
    return;
  }
  if (line) line.qty = Math.round((line.qty + add) * 1000) / 1000;
  else App.cart.push({ lineId:uid(), productId:p.id, name:p.name, unit:p.unit, price:Money.int(p.price), qty:add, discount:0, priceEdited:false });
  renderCart(); renderPosGrid();
}
function setQty(lineId, qty){
  const line = App.cart.find(function(c){ return c.lineId === lineId; });
  if (!line) return;
  const p = App.products.find(function(x){ return x.id === line.productId; });
  let q = Math.round((Number(qty) || 0) * 1000) / 1000;
  if (q <= 0){ App.cart = App.cart.filter(function(c){ return c.lineId !== lineId; }); renderCart(); renderPosGrid(); return; }
  if (p && p.trackStock && !App.settings.allowNegativeStock){
    const other = App.cart.filter(function(c){ return c.productId === line.productId && c.lineId !== lineId; })
                          .reduce(function(a,c){ return a + c.qty; }, 0);
    if (other + q > (Number(p.stock) || 0)){
      q = Math.max(0, (Number(p.stock) || 0) - other);
      toast('Dibatasi sisa stok: ' + qtyText(q) + '.', true);
      if (q === 0){ App.cart = App.cart.filter(function(c){ return c.lineId !== lineId; }); renderCart(); renderPosGrid(); return; }
    }
  }
  line.qty = q;
  renderCart(); renderPosGrid();
}

function renderCart(){
  const box = $('#cart-items'); if (!box) return;
  const cnt = $('#cart-count');
  if (cnt) cnt.textContent = App.cart.reduce(function(a,c){ return a+c.qty; },0).toLocaleString('id-ID') + ' item';

  if (!App.cart.length){
    box.innerHTML = '<div class="empty"><h3>Keranjang kosong</h3><p class="small">Ketuk produk di sebelah kiri untuk menambahkannya.</p></div>';
  } else {
    box.innerHTML = App.cart.map(function(c){
      const gross = Money.int(c.price * c.qty);
      return '<div class="ci" data-line="' + esc(c.lineId) + '">' +
        '<div class="n">' + esc(c.name) + (c.priceEdited ? ' <span class="pill warn">harga diubah</span>' : '') + '</div>' +
        '<div class="t money">' + Money.plain(gross - c.discount) + '</div>' +
        '<div class="meta">' +
          '<span class="qty">' +
            '<button data-dec aria-label="Kurangi">−</button>' +
            '<input inputmode="decimal" value="' + qtyText(c.qty) + '" data-qty aria-label="Jumlah">' +
            '<button data-inc aria-label="Tambah">+</button>' +
          '</span>' +
          '<span class="tiny muted">× ' + Money.plain(c.price) + '</span>' +
          (c.discount ? '<span class="pill">−' + Money.plain(c.discount) + '</span>' : '') +
          '<span class="spacer"></span>' +
          '<button class="btn btn-ghost btn-sm" data-edit title="Ubah harga / diskon">✎</button>' +
          '<button class="btn btn-ghost btn-sm" data-rm title="Hapus">✕</button>' +
        '</div></div>';
    }).join('');
  }

  const t = cartTotals();
  const st = App.settings;
  const foot = $('#cart-foot');
  foot.innerHTML =
    '<div class="totals">' +
      '<div class="tl"><span>Subtotal</span><span class="money">' + Money.plain(t.subtotal) + '</span></div>' +
      (t.itemDiscount ? '<div class="tl"><span>Diskon item</span><span class="money">−' + Money.plain(t.itemDiscount) + '</span></div>' : '') +
      '<div class="tl"><span><button class="btn btn-ghost btn-sm" data-orderdisc style="padding:0;min-height:0">Diskon nota ✎</button></span>' +
        '<span class="money">' + (t.orderDiscount ? '−' + Money.plain(t.orderDiscount) : '—') + '</span></div>' +
      (st.service.enabled ? '<div class="tl"><span>' + esc(st.service.name) + ' ' + Money.bpToText(st.service.bp) + '</span><span class="money">' + Money.plain(t.serviceCharge) + '</span></div>' : '') +
      (st.tax.enabled ? '<div class="tl"><span>' + esc(st.tax.name) + ' ' + Money.bpToText(st.tax.bp) + (st.tax.inclusive ? ' (termasuk)' : '') + '</span><span class="money">' + Money.plain(t.tax) + '</span></div>' : '') +
      (t.roundingAdj ? '<div class="tl"><span>Pembulatan</span><span class="money">' + (t.roundingAdj > 0 ? '+' : '') + Money.plain(t.roundingAdj) + '</span></div>' : '') +
      '<div class="tl grand"><span>Total</span><span class="money">' + Money.plain(t.grandTotal) + '</span></div>' +

      '<div class="row">' +
        '<button class="btn btn-sm" data-park ' + (App.cart.length ? '' : 'disabled') + ' style="flex:1">Tahan nota</button>' +
        '<button class="btn btn-sm" data-detail style="flex:1">Pelanggan &amp; catatan</button>' +
